name: V17 fast tactical-rule and Forge compile regression
on:
  pull_request:
    branches: [feature/v17-multiplayer-threat-coverage-20261010]
    paths:
      - scripts/patch_forge_four_ai_targets.py
      - scripts/audit_v17_coverage.py
      - patches/java/forge/ai/DefenseCoverageModel.java
      - patches/java/forge/ai/MultiplayerDefenseCoverage.java
      - tests/java/forge/ai/DefenseCoverageModelChecks.java
      - patches/java/forge/ai/MultiOpponentDefensePolicy.java
      - tests/java/forge/ai/MultiOpponentDefensePolicyChecks.java
      - scripts/index_human_edh_captions.py
      - tests/test_human_caption_index.py
      - human_reference/videos.json
      - tests/java/forge/ai/MultiplayerCombatTargetChecks.java
      - .github/workflows/four-ai-v17-quick-check.yml
  workflow_dispatch:
concurrency:
  group: four-ai-v17-robustness-fast
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  java-tactical-regressions:
    name: Compile Forge and run all 4-seat tactical invariants
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile-check Python scripts
        run: python3 -m py_compile scripts/patch_forge_four_ai_targets.py scripts/audit_v17_coverage.py
      - name: Verify human-caption indexing preserves unverified status
        run: python3 tests/test_human_caption_index.py
      - uses: actions/download-artifact@v4
        with:
          name: forge-seven-decks-canonical-verified
          run-id: 37966009166
          github-token: ${{ github.token }}
          path: canonical/
      - name: Validate canonical seven Commander decks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forge_decks
          cp canonical/forge_normalized/*.dck forge_decks/
          python3 - <<'PY'
          import hashlib,json,pathlib
          data=json.loads(pathlib.Path('canonical/results/forge_normalization/report.json').read_text())
          assert not data['errors'] and len(data['decks'])==7
          for row in data['decks']:
              file=pathlib.Path('forge_decks')/(row['deck']+'.dck')
              assert hashlib.sha256(file.read_bytes()).hexdigest()==row['normalized_sha256']
          print('FOUR_AI_CANONICAL_DECKS_VALID')
          PY
      - uses: actions/cache/restore@v4
        with:
          path: forge-dist/
          key: forge-2.0.15-linux-shared-20261009
      - name: Install pristine Forge if cache missing
        shell: bash
        run: |
          set -euo pipefail
          if ! find forge-dist -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Patch V13/Charm plus V17 three-opponent coverage solver
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          test -n "$JAR"
          echo "$JAR" > /tmp/four-ai-jar
          python3 scripts/patch_forge_charm_context.py --jar "$JAR"
          python3 scripts/patch_forge_brimaz_v13.py --jar "$JAR"
          python3 scripts/patch_forge_four_ai_targets.py --jar "$JAR"
          mkdir -p /tmp/four-ai-tests
          javac --release 21 -cp "$JAR" -d /tmp/four-ai-tests \
            tests/java/forge/ai/MultiplayerCombatTargetChecks.java
          java -cp "$JAR:/tmp/four-ai-tests" forge.ai.MultiplayerCombatTargetChecks
          javac --release 21 -cp "$JAR" -d /tmp/four-ai-tests tests/java/forge/ai/MultiOpponentDefensePolicyChecks.java
          java -cp "$JAR:/tmp/four-ai-tests" forge.ai.MultiOpponentDefensePolicyChecks
          javac --release 21 -cp "$JAR" -d /tmp/four-ai-tests tests/java/forge/ai/DefenseCoverageModelChecks.java
          java -cp "$JAR:/tmp/four-ai-tests" forge.ai.DefenseCoverageModelChecks
