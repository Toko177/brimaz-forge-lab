name: Verify all Forge deck cards before simulations
on:
  push:
    paths:
      - ".github/workflows/forge-all-cards-check.yml"
      - "scripts/normalize_forge_decks.py"
      - "tests/java/forge/integration/VerifyAllForgeCards.java"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: kaal-playgroup-deck-snapshots
          run-id: 37952122924
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: legality-audit-all-playgroup-pods
          run-id: 37965067128
          github-token: ${{ github.token }}
          path: legality/
      - name: Reconstruct Brimaz exactly as Scryfall-validated
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          entries=[]
          for line in pathlib.Path('decks/Brimaz_V3.txt').read_text().splitlines():
              if not line.strip(): continue
              m=re.fullmatch(r'(\d+)\s+(.+)',line);assert m,line
              entries.append((int(m[1]),m[2]))
          assert sum(q for q,_ in entries)==100
          out=pathlib.Path('forge_decks/Brimaz_V3.dck')
          out.parent.mkdir(exist_ok=True)
          out.write_text('[metadata]\nName=Brimaz V3\n[Main]\n'+''.join(
              f'{q} {n}\n' for q,n in entries if n!='Brimaz, Blight of Oreskos')+
              '[Commander]\n1 Brimaz, Blight of Oreskos\n')
          PY
      - name: Normalize only split-face card names with unchanged deck hashes
        run: python3 scripts/normalize_forge_decks.py --input forge_decks --output forge_normalized --legality legality/report.json
      - uses: actions/cache/restore@v4
        with:
          path: forge-dist/
          key: forge-2.0.15-linux-shared-20261009
      - name: Obtain exact original Forge
        shell: bash
        run: |
          set -euo pipefail
          if ! find forge-dist -name "forge-gui-desktop-*-jar-with-dependencies.jar" -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 "https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2"
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Check every card against actual Forge internal card database
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          mkdir -p test-classes
          javac --release 21 -cp "$JAR" -d test-classes tests/java/forge/integration/VerifyAllForgeCards.java
          (cd "$(dirname "$JAR")" && java -Xmx3g -cp "$JAR:$GITHUB_WORKSPACE/test-classes" forge.integration.VerifyAllForgeCards "$GITHUB_WORKSPACE"/forge_normalized/*.dck)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-seven-decks-canonical-verified
          path: |
            forge_normalized/
            results/forge_normalization/
          if-no-files-found: ignore
