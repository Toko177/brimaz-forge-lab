name: Independently certify and quantify V13 16-game Commander pilot
on:
  push:
    paths: [.github/workflows/brimaz-v13-16-independent-certification.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify-v13:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests for all four-seat game outcomes and balanced winrate estimates
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Require original V13 real-match workflow to have finished
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          complete=0
          for n in $(seq 1 40); do
            status="$(gh api 'repos/${{ github.repository }}/actions/runs/38002838904' --jq '.status')"
            echo "V13 source status: $status poll $n"
            if [[ "$status" == completed ]]; then complete=1; break; fi
            sleep 30
          done
          [[ "$complete" == 1 ]] || { echo "Cannot certify incomplete V13 source"; exit 2; }
      - uses: actions/download-artifact@v4
        with:
          pattern: brimaz-v13-incubate-adaptive-*-r*
          run-id: 38002838904
          github-token: ${{ github.token }}
          path: games/
      - uses: actions/download-artifact@v4
        with:
          name: legality-audit-all-playgroup-pods
          run-id: 37965067128
          github-token: ${{ github.token }}
          path: legality/
      - name: Independent strict four-seat and Scryfall legality certificates
        run: |
          python3 scripts/certify_commander_games.py \
            --input games --legality legality/report.json \
            --out results/v13-certified/certification
      - name: Enforce real 8-shard 16-game balanced seat matrix and sha256 checks
        run: |
          python3 scripts/audit_balanced_commander_campaign.py \
            --input games \
            --certificate results/v13-certified/certification/certificate.json \
            --output results/v13-certified/balanced-games.json \
            --per-pod-rotation 2 --policy V13-incubate-adaptive
      - name: Audit same four-player adaptive budget and decision timeouts
        run: |
          python3 scripts/audit_adaptive_ai_budget.py \
            --input games --output results/v13-certified/adaptive-decisions.json
          python3 scripts/audit_ai_eval_hotspots.py \
            --input games --output results/v13-certified/ai-hotspots.json
          python3 scripts/audit_missing_ai_handlers.py \
            --input games --output results/v13-certified/missing-ai-apis.json
          python3 scripts/audit_brimaz_combat.py \
            --input games --output results/v13-certified/brimaz-combat.json
      - name: Report complete denominator including all rejected and censored games
        run: |
          python3 - <<'PY'
          import pathlib,json
          d=json.loads(pathlib.Path("results/v13-certified/balanced-games.json").read_text())
          a=json.loads(pathlib.Path("results/v13-certified/adaptive-decisions.json").read_text())
          assert d["summary"]["scheduled"] == 16
          assert d["summary"]["groups_pod_rotation"] == 8
          assert a["summary"]["games"] == 16
          print("V13_STRICT_16_GAME_CAMPAIGN",json.dumps(d["summary"],ensure_ascii=False))
          print("V13_STRICT_POD_BREAKDOWN",json.dumps(d["by_pod"],ensure_ascii=False))
          print("V13_STRICT_SEAT_BREAKDOWN",json.dumps(d["by_brimaz_seat"],ensure_ascii=False))
          print("V13_EQUITABLE_AI_BUDGET",json.dumps(a["summary"],ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brimaz-v13-independent-16-game-certification
          path: results/v13-certified/
          if-no-files-found: ignore
