name: Compare Brimaz planner against stock Forge
on:
  workflow_run:
    workflows:
      - Brimaz tactical AI policy parallel benchmark
    types:
      - completed
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified baseline Forge logs
        uses: actions/download-artifact@v4
        with:
          pattern: forge-parallel-*
          run-id: 37955082304
          github-token: ${{ github.token }}
          path: stock/
      - name: Fetch all modified Forge logs
        uses: actions/download-artifact@v4
        with:
          pattern: brimaz-planner-v1-*
          run-id: 37959185948
          github-token: ${{ github.token }}
          path: candidate/
      - name: Compare reproducible matched pods seats seeds and game outcomes
        run: python3 scripts/compare_policy.py --baseline stock --candidate candidate --output results/policy/pairwise_v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brimaz-stock-vs-planner-matched-comparison
          path: results/policy/
