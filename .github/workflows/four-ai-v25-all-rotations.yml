name: V25 real Forge four AI all pod rotations 16-JVM combat proof
on:
  pull_request:
    branches: [feature/v24-combat-trigger-fast-negatives-20261011]
    paths:
      - scripts/patch_forge_four_ai_targets.py
      - scripts/audit_v24_combat_prune.py
      - scripts/aggregate_v25_eight_seats.py
      - tests/test_v25_state_sensitive_trace.py
      - tests/test_aggregate_v25_eight_seats.py
      - scripts/patch_forge_combat_trigger_prune.py
      - patches/java/forge/ai/CombatTriggerNegativePrune.java
      - tests/java/forge/ai/CombatTriggerNegativePruneChecks.java
      - scripts/patch_forge_brimaz_v13.py
      - patches/java/forge/ai/AiTimeoutCooldownPolicy.java
      - tests/java/forge/ai/AiTimeoutCooldownChecks.java
      - scripts/patch_forge_counter_critical.py
      - patches/java/forge/ai/ability/MultiplayerCriticalCounterPolicy.java
      - tests/java/forge/ai/ability/MultiplayerCriticalCounterChecks.java
      - scripts/patch_forge_multiplayer_removal.py
      - patches/java/forge/ai/MultiplayerRemovalUrgencyPolicy.java
      - tests/java/forge/ai/MultiplayerRemovalUrgencyChecks.java
      - patches/java/forge/ai/DefenseCoverageModel.java
      - patches/java/forge/ai/MultiplayerDefenseCoverage.java
      - tests/java/forge/ai/DefenseCoverageModelChecks.java
      - patches/java/forge/ai/MultiOpponentDefensePolicy.java
      - tests/java/forge/ai/MultiOpponentDefensePolicyChecks.java
      - scripts/index_human_edh_captions.py
      - tests/test_human_caption_index.py
      - human_reference/videos.json
      - tests/java/forge/ai/MultiplayerCombatTargetChecks.java
      - .github/workflows/four-ai-v25-all-rotations.yml
  workflow_dispatch:
concurrency:
  group: four-ai-v25-comprehensive-proof
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  four-seat-combat:
    name: "Real Forge A/B ${{ matrix.pod }} rotation ${{ matrix.rotation }}"
    runs-on: ubuntu-latest
    timeout-minutes: 31
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {pod: aristo, rotation: 0}
          - {pod: aristo, rotation: 1}
          - {pod: aristo, rotation: 2}
          - {pod: aristo, rotation: 3}
          - {pod: artifact, rotation: 0}
          - {pod: artifact, rotation: 1}
          - {pod: artifact, rotation: 2}
          - {pod: artifact, rotation: 3}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile-check Python scripts
        run: python3 -m py_compile scripts/patch_forge_four_ai_targets.py scripts/audit_v24_combat_prune.py
      - name: Validate tournament aggregation on clearly synthetic unit fixtures
        run: |
          python3 -m py_compile scripts/aggregate_four_ai_tournament.py scripts/audit_v24_combat_prune.py
          python3 tests/test_aggregate_four_ai_tournament.py
          python3 tests/test_v25_state_sensitive_trace.py
          python3 tests/test_aggregate_v25_eight_seats.py
      - name: Verify human-caption indexing preserves unverified status
        run: python3 tests/test_human_caption_index.py
      - uses: actions/download-artifact@v4
        with:
          name: forge-seven-decks-canonical-verified
          run-id: 37966009166
          github-token: ${{ github.token }}
          path: canonical/
      - name: Validate canonical seven Commander decks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forge_decks
          cp canonical/forge_normalized/*.dck forge_decks/
          python3 - <<'PY'
          import hashlib,json,pathlib
          data=json.loads(pathlib.Path('canonical/results/forge_normalization/report.json').read_text())
          assert not data['errors'] and len(data['decks'])==7
          for row in data['decks']:
              file=pathlib.Path('forge_decks')/(row['deck']+'.dck')
              assert hashlib.sha256(file.read_bytes()).hexdigest()==row['normalized_sha256']
          print('FOUR_AI_CANONICAL_DECKS_VALID')
          PY
      - uses: actions/cache/restore@v4
        with:
          path: forge-dist/
          key: forge-2.0.15-linux-shared-20261009
      - name: Install pristine Forge if cache missing
        shell: bash
        run: |
          set -euo pipefail
          if ! find forge-dist -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Patch shared Forge AI and public critical counter response
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          test -n "$JAR"
          echo "$JAR" > /tmp/four-ai-jar
          python3 scripts/patch_forge_charm_context.py --jar "$JAR"
          python3 scripts/patch_forge_brimaz_v13.py --jar "$JAR"
          python3 scripts/patch_forge_four_ai_targets.py --jar "$JAR"
          python3 scripts/patch_forge_multiplayer_removal.py --jar "$JAR"
          python3 scripts/patch_forge_counter_critical.py --jar "$JAR"
          python3 scripts/patch_forge_combat_trigger_prune.py --jar "$JAR"
          mkdir -p /tmp/four-ai-tests
          javac --release 21 -cp "$JAR" -d /tmp/four-ai-tests \
            tests/java/forge/ai/MultiplayerCombatTargetChecks.java
          java -cp "$JAR:/tmp/four-ai-tests" forge.ai.MultiplayerCombatTargetChecks
          javac --release 21 -cp "$JAR" -d /tmp/four-ai-tests tests/java/forge/ai/MultiOpponentDefensePolicyChecks.java
          java -cp "$JAR:/tmp/four-ai-tests" forge.ai.MultiOpponentDefensePolicyChecks
          javac --release 21 -cp "$JAR" -d /tmp/four-ai-tests tests/java/forge/ai/DefenseCoverageModelChecks.java
          java -cp "$JAR:/tmp/four-ai-tests" forge.ai.DefenseCoverageModelChecks
          javac --release 21 -cp "$JAR" -d /tmp/four-ai-tests tests/java/forge/ai/MultiplayerRemovalUrgencyChecks.java
          java -cp "$JAR:/tmp/four-ai-tests" forge.ai.MultiplayerRemovalUrgencyChecks
          javac --release 21 -cp "$JAR" -d /tmp/four-ai-tests tests/java/forge/ai/ability/MultiplayerCriticalCounterChecks.java
          java -cp "$JAR:/tmp/four-ai-tests" forge.ai.ability.MultiplayerCriticalCounterChecks
          javac --release 21 -cp "$JAR" -d /tmp/four-ai-tests tests/java/forge/ai/AiTimeoutCooldownChecks.java
          java -cp "$JAR:/tmp/four-ai-tests" forge.ai.AiTimeoutCooldownChecks
          javac --release 21 -cp "$JAR" -d /tmp/four-ai-tests tests/java/forge/ai/CombatTriggerNegativePruneChecks.java
          java -cp "$JAR:/tmp/four-ai-tests" forge.ai.CombatTriggerNegativePruneChecks
      - name: 'V24 control prediction with no fast-negative pruning'
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_TOOL_OPTIONS="-Dbrimaz.fourSeatCombatTarget=true -Dbrimaz.deterministicForcedAttacks=true -Dbrimaz.fourSeatDefensiveReserve=false -Dbrimaz.fourSeatDefenseCoverage=true -Dbrimaz.coverageProactive=false -Dbrimaz.fourSeatRemovalUrgency=false -Dbrimaz.removalShadowAudit=false -Dbrimaz.fourSeatCounterCritical=false -Dbrimaz.aiTimeoutCooldown=false -Dbrimaz.fastCombatTriggerNegativePrune=false"
          python3 scripts/batch.py --jar "$(cat /tmp/four-ai-jar)" --require-canonical-decks \
            --pod "${{ matrix.pod }}" --rotation "${{ matrix.rotation }}" \
            --out-tag V24-stock-trigger --policy-label stock-combat-triggers \
            --seed-base 20261029 --clock 420 --timeout 505 --games-per-rotation 1
      - name: V24 AI-only exact negative prediction optimization for all four seats
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_TOOL_OPTIONS="-Dbrimaz.fourSeatCombatTarget=true -Dbrimaz.deterministicForcedAttacks=true -Dbrimaz.fourSeatDefensiveReserve=false -Dbrimaz.fourSeatDefenseCoverage=true -Dbrimaz.coverageProactive=false -Dbrimaz.fourSeatRemovalUrgency=false -Dbrimaz.removalUrgencyTrace=false -Dbrimaz.removalShadowAudit=false -Dbrimaz.fourSeatCounterCritical=false -Dbrimaz.aiTimeoutCooldown=false -Dbrimaz.fastCombatTriggerNegativePrune=true -Dbrimaz.fastCombatTriggerTrace=true"
          python3 scripts/batch.py --jar "$(cat /tmp/four-ai-jar)" --require-canonical-decks \
            --pod "${{ matrix.pod }}" --rotation "${{ matrix.rotation }}" \
            --out-tag V24-fast-negative-trigger --policy-label exact-negative-triggers \
            --seed-base 20261029 --clock 420 --timeout 505 --games-per-rotation 1
      - name: Audit counted fast negative trigger predictions and genuine match outcomes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_v24_combat_prune.py --rotation "${{ matrix.rotation }}" --pod "${{ matrix.pod }}" \
            --out "results/v24_trigger/${{ matrix.pod }}_rotation${{ matrix.rotation }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "four-ai-v25-trigger-${{ matrix.pod }}-rot${{ matrix.rotation }}"
          path: |
            results/batch/
            results/v24_trigger/
          retention-days: 30
          if-no-files-found: ignore

  summary:
    name: Verify all 16 real JVM matches and state-sensitive A/B summary
    if: always()
    needs: [four-seat-combat]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download all independently executed four-seat Forge raw game artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: four-ai-v25-trigger-*
          path: downloaded/
      - name: Require eight distinct original and optimized four-seat rotations
        run: |
          set -euo pipefail
          python3 tests/test_v25_state_sensitive_trace.py
          python3 tests/test_aggregate_v25_eight_seats.py
          python3 scripts/aggregate_v25_eight_seats.py --input downloaded/ --output results/v25_all_rotations/paired.json
          python3 scripts/aggregate_four_ai_tournament.py --input downloaded/ --out results/v25_all_rotations/ --expected-games 16 --expected-jobs 16
      - name: Upload genuine game and A/B tournament summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-ai-v25-evidence-summary
          path: results/v25_all_rotations/
          retention-days: 30
          if-no-files-found: ignore
