name: Audit V3 Brimaz tactical AI decisions
on:
  workflow_run:
    workflows:
      - Brimaz tactical V3 parallel benchmark
    types:
      - completed
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: brimaz-planner-v3-*
          run-id: 37962437566
          github-token: ${{ github.token }}
          path: artifacts/
      - name: Classify Brimaz sacrifice timing in real Forge matches
        run: python3 scripts/audit_ai.py --logs artifacts --out results/audit/v3_timing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brimaz-v3-behavioral-ai-audit
          path: results/audit/
