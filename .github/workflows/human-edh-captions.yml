name: Ingest public human Commander caption references
on:
  pull_request:
    paths:
      - scripts/fetch_human_edh_captions.py
      - tests/test_human_video_fetch.py
      - human_reference/videos.json
      - .github/workflows/human-edh-captions.yml
  workflow_dispatch:
concurrency:
  group: human-edh-caption-collector
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  youtube-reference-index:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned transcript library
        run: python -m pip install youtube-transcript-api==1.2.4
      - name: Validate offline handling without accessing videos
        run: python tests/test_human_video_fetch.py
      - name: Try to fetch four public Commander video caption tracks
        run: python scripts/fetch_human_edh_captions.py
      - name: Preserve access evidence and bounded, unverified samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-edh-youtube-caption-evidence
          path: results/human_edh/
          retention-days: 14
          if-no-files-found: ignore
