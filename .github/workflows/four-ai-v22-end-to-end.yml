name: V22 real 4-AI simulator end-to-end operator smoke
on:
  pull_request:
    branches: [feature/four-ai-critical-counter-response-20261010]
    paths:
      - scripts/patch_forge_counter_critical.py
      - patches/java/forge/ai/ability/MultiplayerCriticalCounterPolicy.java
      - scripts/audit_critical_counter.py
      - tests/java/forge/ai/ability/MultiplayerCriticalCounterChecks.java
      - .github/workflows/four-ai-v22-end-to-end.yml
  workflow_dispatch:
concurrency:
  group: v22-operator-e2e-smoke
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  real-4ai-operator:
    name: Run genuine Forge Commander and certify the operator report chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python tools, synthetic counter-example gates
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch_forge_counter_critical.py scripts/audit_critical_counter.py scripts/forensic_four_seat.py scripts/aggregate_four_ai_tournament.py
          python3 tests/test_forensic_four_seat.py
          python3 tests/test_assess_simulator_readiness.py
          python3 tests/test_aggregate_four_ai_tournament.py
      - name: Download seven canonical normalized real player decks
        uses: actions/download-artifact@v4
        with:
          name: forge-seven-decks-canonical-verified
          run-id: 37966009166
          github-token: ${{ github.token }}
          path: canonical/
      - name: Refuse missing or modified canonical SHA256 decklists
        run: |
          set -euo pipefail
          mkdir -p forge_decks
          cp canonical/forge_normalized/*.dck forge_decks/
          python3 - <<'PY'
          import hashlib,json,pathlib
          x=json.loads(pathlib.Path('canonical/results/forge_normalization/report.json').read_text())
          assert not x['errors'] and len(x['decks'])==7
          for d in x['decks']:
              file=pathlib.Path('forge_decks')/(d['deck']+'.dck')
              assert hashlib.sha256(file.read_bytes()).hexdigest()==d['normalized_sha256']
          print('V22_ALL_SEVEN_REAL_DECKS_SHA256_MATCH')
          PY
      - uses: actions/cache/restore@v4
        with:
          key: forge-2.0.15-linux-shared-20261009
          path: forge-dist/
      - name: Restore pinned original Forge if cache missing
        run: |
          set -euo pipefail
          if ! find forge-dist -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 \
              'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Patch original engine, and compile real four-player stack-response AI
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit)"
          test -s "$JAR"
          echo "$JAR" > /tmp/v22_real_forge_jar
          python3 scripts/patch_forge_charm_context.py --jar "$JAR"
          python3 scripts/patch_forge_brimaz_v13.py --jar "$JAR"
          python3 scripts/patch_forge_four_ai_targets.py --jar "$JAR"
          python3 scripts/patch_forge_counter_critical.py --jar "$JAR"
          mkdir -p /tmp/v22_checks
          javac --release 21 -cp "$JAR" -d /tmp/v22_checks tests/java/forge/ai/ability/MultiplayerCriticalCounterChecks.java
          java -cp "$JAR:/tmp/v22_checks" forge.ai.ability.MultiplayerCriticalCounterChecks
      - name: True four-player Forge Commander game with detailed stack telemetry
        env:
          JAVA_TOOL_OPTIONS: "-Dbrimaz.fourSeatCombatTarget=true -Dbrimaz.deterministicForcedAttacks=true -Dbrimaz.fourSeatDefenseCoverage=true -Dbrimaz.fourSeatCounterCritical=true -Dbrimaz.counterDecisionAudit=true"
        run: |
          set -euo pipefail
          python3 scripts/batch.py --jar "$(cat /tmp/v22_real_forge_jar)" \
            --require-canonical-decks --pod aristo --rotation 1 --seed-base 20261023 \
            --games-per-rotation 1 --clock 360 --timeout 445 \
            --out-tag v22-operator-smoke --policy-label v22-counter-telemetry
      - name: Exercise exact operator forensic and tournament tools on real raw logs
        run: |
          set -euo pipefail
          python3 scripts/forensic_four_seat.py --input results/batch/ --output results/v22_operator/
          python3 scripts/aggregate_four_ai_tournament.py --input results/batch/ \
            --out results/v22_operator/ --expected-games 1 --expected-jobs 1
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('results/v22_operator')
          agg=json.loads((root/'tournament.json').read_text())
          forensic=json.loads((root/'four_seat_actions.json').read_text())
          assert agg['games_started']==1 and agg['unique_seat_pod_seed_policy_games']==1,agg
          assert forensic['summary']['game_count']==1,forensic['summary']
          assert len(forensic['games'][0]['players'])==4
          print('V22_GENUINE_FORGE_OPERATOR_E2E_PASS',json.dumps({
              'real_jvms':agg['games_started'],
              'natural':agg['games_naturally_complete_unindependently_certified'],
              'statuses':agg['status_counts'],
              'turns':forensic['games'][0]['identity']['observed_turn_events']
          }))
          PY
      - name: Archive all raw Commander game logs, player timelines and match outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-ai-v22-real-operator-smoke
          path: |
            results/batch/
            results/v22_operator/
          retention-days: 30
          if-no-files-found: ignore
