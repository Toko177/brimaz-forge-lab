name: Inspect missing Forge AI handlers in 32 real V12 Commander games
on:
  push:
    paths:
      - .github/workflows/v12-32-missing-ai-handler-audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify missing-handler evidence parser
        run: python3 -m unittest discover -s tests -p 'test_missing_ai_handlers.py' -v
      - uses: actions/download-artifact@v4
        with:
          pattern: brimaz-v12-32-*
          run-id: 38001534517
          github-token: ${{ github.token }}
          path: real-games/
      - name: Inventory any other unsupported AI abilities without changing rules
        run: |
          python3 scripts/audit_missing_ai_handlers.py \
            --input real-games/ \
            --output results/ai-coverage/v12-32-missing-api.json
          python3 - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('results/ai-coverage/v12-32-missing-api.json').read_text())
          assert d['summary']['games']==32
          print('REAL_FORGE_API_COVERAGE_32',json.dumps(d['summary'],ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-32-missing-forge-ai-api-audit
          path: results/ai-coverage/
          if-no-files-found: ignore
