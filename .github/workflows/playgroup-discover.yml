name: Discover KaalDeagle public decks
on:
  push:
    paths:
      - ".github/workflows/playgroup-discover.yml"
      - "scripts/discover_kaaldeagle.py"
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Discover KaalDeagle Commander decks
        run: python3 scripts/discover_kaaldeagle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaal-playgroup-catalog
          path: results/playgroup/
          if-no-files-found: ignore
