name: Brimaz Reckless AI profile A/B pilot
on:
  push:
    paths:
      - ".github/workflows/reckless-ai-benchmark.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reckless-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        pod: [aristo, artifact]
        rotation: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: kaal-playgroup-deck-snapshots
          run-id: 37952122924
          github-token: ${{ github.token }}
          path: .
      - uses: actions/cache@v4
        with:
          path: forge-dist/
          key: forge-2.0.15-linux-shared-20261009
      - name: Obtain Forge release if cache empty
        shell: bash
        run: |
          set -euo pipefail
          if ! find forge-dist -name "forge-gui-desktop-*-jar-with-dependencies.jar" -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 "https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2"
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Test Reckless Brimaz AI on baseline matched seeds
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/batch.py --jar "$JAR" --pod "${{ matrix.pod }}" --rotation "${{ matrix.rotation }}" --profile-brimaz Reckless --profile-opponents Default --out-tag Reckless --seed-base 20261009 --clock 360 --timeout 445 --games-per-rotation 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "forge-reckless-${{ matrix.pod }}-seat${{ matrix.rotation }}"
          path: results/batch/${{ matrix.pod }}/Reckless/
          if-no-files-found: ignore
  aggregate:
    needs: [reckless-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: forge-reckless-*
          path: artifacts/
      - run: python3 scripts/aggregate_batch.py --input artifacts --expected-groups 2 --expected-per-group 8 --output results/parallel/reckless_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-reckless-aggregated
          path: results/parallel/
