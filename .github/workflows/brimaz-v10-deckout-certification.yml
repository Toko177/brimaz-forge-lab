name: Re-certify all V10 Forge games after deck-out parser fix
on:
  push:
    paths:
      - .github/workflows/brimaz-v10-deckout-certification.yml
      - scripts/forge_result_evidence.py
      - scripts/certify_commander_games.py
      - tests/test_forge_evidence.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reverify-all-seats-and-natural-eliminations:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Ensure deck-out remains a fully validated fourth outcome, not an exception
        run: python3 -m unittest discover -s tests -p 'test_forge_evidence.py' -v
      - uses: actions/download-artifact@v4
        with:
          pattern: brimaz-v10-ai-hotspot-*
          run-id: 37999502125
          github-token: ${{ github.token }}
          path: real-games/
      - uses: actions/download-artifact@v4
        with:
          name: legality-audit-all-playgroup-pods
          run-id: 37965067128
          github-token: ${{ github.token }}
          path: legality/
      - name: Independently certify all four untouched V10 Forge outcomes
        run: python3 scripts/certify_commander_games.py --input real-games/ --legality legality/report.json --out results/v10-recertified/
      - name: Require a complete four-seat winning record, no cutoffs and no invented extra winners
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("results/v10-recertified/certificate.json")
          data=json.loads(p.read_text())
          print("V10_CERTIFIED_WITH_DECKOUT_LOSS",json.dumps(data['summary'],ensure_ascii=False))
          assert data['summary']['checked_games']==4
          assert data['summary']['accepted_natural_games']==4,data
          assert data['summary']['excluded_games']==0,data
          assert data['summary']['accepted_brimaz_wins']==1,data
          assert data['summary']['accepted_warning_free_brimaz_wins']==0,data
          assert data['summary']['accepted_warning_free_natural_games']<4,data
          assert sum(g['brimaz_win'] is True and g['engine_natural_and_consistent'] for g in data['games'])==1
          for g in data['games']:
              assert g['engine_natural_and_consistent'] and g['legal_deck_gate']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brimaz-v10-corrected-four-seat-certificates
          path: results/v10-recertified/
          if-no-files-found: ignore
