name: Forge combat CPU research
on:
  push:
    paths: [.github/workflows/commander-combat-jfr-profile.yml]
permissions:
  contents: read
  actions: read
jobs:
  live-cpu-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pod: aristo, rotation: 1, seed: 20310001}
          - {pod: artifact, rotation: 3, seed: 20520001}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify CPU profiler JFR parsing
        run: python3 -m unittest discover -s tests -p 'test_combat_jfr_probe.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: forge-seven-decks-canonical-verified
          run-id: 37966009166
          github-token: ${{ github.token }}
          path: canonical/
      - name: Verify pinned original Commander cards
        run: |
          mkdir -p forge_decks
          cp canonical/forge_normalized/*.dck forge_decks/
          python3 - <<'PY'
          import pathlib,json,hashlib
          data=json.loads(pathlib.Path("canonical/results/forge_normalization/report.json").read_text())
          assert len(data["decks"])==7
          for d in data["decks"]:
              p=pathlib.Path("forge_decks")/(d["deck"]+".dck")
              assert hashlib.sha256(p.read_bytes()).hexdigest()==d["normalized_sha256"]
          PY
      - name: Download official SHA256-verified Forge 2.0.15 engine
        run: |
          curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
          echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
          mkdir -p forge-dist && tar -xjf forge.tar.bz2 -C forge-dist
      - name: Apply same disclosed Charm fix and V13 four-seat AI
        run: |
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/patch_forge_charm_context.py --jar "$JAR"
          python3 scripts/patch_forge_brimaz_v13.py --jar "$JAR"
      - name: Observe genuine Commander match using JDK Flight Recorder only
        env:
          POD: ${{ matrix.pod }}
          ROT: ${{ matrix.rotation }}
          SEED: ${{ matrix.seed }}
        run: |
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/combat_jfr_probe.py --jar "$JAR" --decks forge_decks \
            --pod "$POD" --rotation "$ROT" --seed "$SEED" \
            --clock 360 --timeout 445 --output "results/jfr/$POD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "combat-jfr-${{ matrix.pod }}"
          path: results/jfr/
          if-no-files-found: ignore
