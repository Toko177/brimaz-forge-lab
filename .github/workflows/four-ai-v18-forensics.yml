name: V18 Forge four-AI forensic and functional release gate
on:
  pull_request:
    branches: [feature/v17-defense-robustness-20261010]
    paths:
      - scripts/forensic_four_seat.py
      - scripts/assess_simulator_readiness.py
      - tests/test_forensic_four_seat.py
      - tests/test_assess_simulator_readiness.py
      - .github/workflows/four-ai-v18-forensics.yml
  workflow_dispatch:
concurrency:
  group: v18-four-ai-forensics
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  verify-real-forge-games:
    name: Inspect eight archived genuine four-AI Commander games
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate parser and negative readiness tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/forensic_four_seat.py scripts/assess_simulator_readiness.py
          python3 tests/test_forensic_four_seat.py
          python3 tests/test_assess_simulator_readiness.py
      - name: Restore complete raw 4-seat Forge logs from audited V17 Action
        uses: actions/download-artifact@v4
        with:
          pattern: four-ai-v17-*
          run-id: 38081333961
          github-token: ${{ github.token }}
          path: archived_v17/
          merge-multiple: false
      - name: Confirm exact four paired real game matrices were restored
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('archived_v17')
          files=sorted(root.rglob('games.json'))
          assert len(files)==8, [str(f) for f in files]
          positions={(json.loads(f.read_text())[0]['pod'],
                      json.loads(f.read_text())[0]['rotation'])
                     for f in files}
          assert positions=={('artifact',1),('artifact',2),('aristo',1),('aristo',2)},positions
          assert sum(len(json.loads(f.read_text())) for f in files)==8
          assert len(list(root.rglob('*.log')))==8
          print('GENUINE_FORGE_FOUR_PLAYER_ARCHIVES_VERIFIED games=8 matrices=4')
          PY
      - name: Generate turn-by-turn factual decisions for all four AI seats
        run: |
          python3 scripts/forensic_four_seat.py --input archived_v17/ --output results/v18_forensics/
      - name: Gate functional readiness separately from strategy and winrate
        run: |
          python3 scripts/assess_simulator_readiness.py \
            --forensics results/v18_forensics/four_seat_actions.json \
            --out results/v18_forensics/readiness_gate.json --min-games 8
      - name: Save reproducible evidence, data and human-readable assessment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-ai-v18-forensics-real-forge-8-games
          path: results/v18_forensics/
          retention-days: 30
          if-no-files-found: ignore
