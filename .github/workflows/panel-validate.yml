name: Validate public Commander opponents
on:
  push:
    paths:
      - ".github/workflows/panel-validate.yml"
      - "scripts/import_archidekt.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  import-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download previously captured Archidekt snapshots
        uses: actions/download-artifact@v4
        with:
          name: bracket3-opponent-imports
          run-id: 37949653452
          github-token: ${{ github.token }}
          path: .
      - name: Import Commander lists from immutable snapshot
        run: python3 scripts/import_archidekt.py --offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bracket3-opponent-imports
          path: |
            forge_decks/
            results/panel.json
            results/archidekt_snapshots/
          if-no-files-found: ignore
