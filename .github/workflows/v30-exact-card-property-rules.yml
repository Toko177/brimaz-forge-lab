name: V30 real 4-AI Forge five exact rules versus original full method
on:
  pull_request:
    branches: [feature/v28-real-card-property-hotpath-profile-20261011]
    paths:
      - .github/workflows/v30-exact-card-property-rules.yml
      - scripts/patch_forge_card_property_fastpath.py
      - scripts/audit_v30_exact_property_rules.py
      - patches/java/forge/game/card/CardPropertyLiteralFastPath.java
      - tests/java/forge/game/card/CardPropertyLiteralFastPathChecks.java
  workflow_dispatch:
concurrency:
  group: v30-actual-fours-seat-exact-rule-a-b
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  real-four-ai-rule-evaluation:
    name: Exact Oracle rules A/B on pod ${{ matrix.pod }}
    runs-on: ubuntu-latest
    timeout-minutes: 36
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {pod: aristo, rotation: 1}
          - {pod: artifact, rotation: 2}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: forge-seven-decks-canonical-verified
          run-id: 37966009166
          github-token: ${{ github.token }}
          path: canonical/
      - name: Exact original seven-player deck verification
        run: |
          set -euo pipefail
          mkdir -p forge_decks
          cp canonical/forge_normalized/*.dck forge_decks/
          python3 - <<'PY'
          import hashlib,json,pathlib
          x=json.loads(pathlib.Path('canonical/results/forge_normalization/report.json').read_text())
          assert len(x['decks'])==7 and not x['errors']
          for v in x['decks']:
            f=pathlib.Path('forge_decks')/(v['deck']+'.dck')
            assert hashlib.sha256(f.read_bytes()).hexdigest()==v['normalized_sha256']
          print('FOUR_AI_V30_SEVEN_DECKS_SHA256_IDENTICAL')
          PY
      - uses: actions/cache/restore@v4
        with:
          key: forge-2.0.15-linux-shared-20261009
          path: forge-dist/
      - name: Fetch pristine official Forge 2.0.15 if not present
        run: |
          set -euo pipefail
          if ! find forge-dist -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Compile original Forge card rules alongside opt-in exact five-literal fast paths
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit)"
          test -s "$JAR"
          echo "$JAR" > /tmp/real-forge-v30-jar
          python3 scripts/patch_forge_charm_context.py --jar "$JAR"
          python3 scripts/patch_forge_brimaz_v13.py --jar "$JAR"
          python3 scripts/patch_forge_four_ai_targets.py --jar "$JAR"
          python3 scripts/patch_forge_combat_trigger_prune.py --jar "$JAR"
          python3 scripts/patch_forge_card_property_fastpath.py --jar "$JAR"
          mkdir -p /tmp/real-forge-property-tests
          javac --release 21 -cp "$JAR" -d /tmp/real-forge-property-tests \
            tests/java/forge/game/card/CardPropertyLiteralFastPathChecks.java
          java -Dbrimaz.fastCardPropertyExactLiterals=true -Dbrimaz.cardPropertyShadowVerify=true -cp "$JAR:/tmp/real-forge-property-tests" \
            forge.game.card.CardPropertyLiteralFastPathChecks
      - name: Play true four-AI stock unoptimized Forge rules
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Dbrimaz.fourSeatCombatTarget=true -Dbrimaz.deterministicForcedAttacks=true -Dbrimaz.fourSeatDefenseCoverage=true -Dbrimaz.coverageProactive=false -Dbrimaz.aiTimeoutCooldown=false -Dbrimaz.fastCombatTriggerNegativePrune=false -Dbrimaz.fastCardPropertyExactLiterals=false"
        run: |
          set -euo pipefail
          python3 scripts/batch.py --jar "$(cat /tmp/real-forge-v30-jar)" \
            --require-canonical-decks --pod "${{ matrix.pod }}" --rotation "${{ matrix.rotation }}" \
            --out-tag V30-stock-exact --policy-label V30-stock-exact --seed-base 20261101 \
            --clock 420 --timeout 505 --games-per-rotation 1
      - name: Play true four-AI exact five card rules with fast path
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Dbrimaz.fourSeatCombatTarget=true -Dbrimaz.deterministicForcedAttacks=true -Dbrimaz.fourSeatDefenseCoverage=true -Dbrimaz.coverageProactive=false -Dbrimaz.aiTimeoutCooldown=false -Dbrimaz.fastCombatTriggerNegativePrune=false -Dbrimaz.fastCardPropertyExactLiterals=true -Dbrimaz.cardPropertyFastTrace=true"
        run: |
          set -euo pipefail
          python3 scripts/batch.py --jar "$(cat /tmp/real-forge-v30-jar)" \
            --require-canonical-decks --pod "${{ matrix.pod }}" --rotation "${{ matrix.rotation }}" \
            --out-tag V30-fast-exact --policy-label V30-fast-exact --seed-base 20261101 \
            --clock 420 --timeout 505 --games-per-rotation 1
      - name: Play true four-AI full stock comparison on every fast literal
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Dbrimaz.fourSeatCombatTarget=true -Dbrimaz.deterministicForcedAttacks=true -Dbrimaz.fourSeatDefenseCoverage=true -Dbrimaz.coverageProactive=false -Dbrimaz.aiTimeoutCooldown=false -Dbrimaz.fastCombatTriggerNegativePrune=false -Dbrimaz.fastCardPropertyExactLiterals=true -Dbrimaz.cardPropertyFastTrace=true -Dbrimaz.cardPropertyShadowVerify=true"
        run: |
          set -euo pipefail
          python3 scripts/batch.py --jar "$(cat /tmp/real-forge-v30-jar)" \
            --require-canonical-decks --pod "${{ matrix.pod }}" --rotation "${{ matrix.rotation }}" \
            --out-tag V30-shadow-verified --policy-label V30-shadow-verified --seed-base 20261101 \
            --clock 420 --timeout 505 --games-per-rotation 1
      - name: Check original Oracle return equivalence in genuine play and natural outcomes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_v30_exact_property_rules.py \
            --pod "${{ matrix.pod }}" --rotation "${{ matrix.rotation }}" \
            --input results/batch --output "results/v30_rules/${{ matrix.pod }}_rot${{ matrix.rotation }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-ai-v30-exact-rules-${{ matrix.pod }}-rot${{ matrix.rotation }}
          path: |
            results/batch/
            results/v30_rules/
          retention-days: 30
          if-no-files-found: ignore
