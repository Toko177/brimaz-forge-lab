name: V12 balanced 32-real-game Commander multi-runner campaign
concurrency:
  group: v12-balanced32-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    paths: [.github/workflows/brimaz-v12-balanced-32-games.yml, scripts/patch_forge_brimaz_v12.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  v12-campaign:
    name: "${{ matrix.pod }} r${{ matrix.rotation }} seed${{ matrix.seed_base }}"
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {pod: aristo, rotation: 0, seed_base: 20310000}
          - {pod: aristo, rotation: 1, seed_base: 20310000}
          - {pod: aristo, rotation: 2, seed_base: 20310000}
          - {pod: aristo, rotation: 3, seed_base: 20310000}
          - {pod: aristo, rotation: 0, seed_base: 20410000}
          - {pod: aristo, rotation: 1, seed_base: 20410000}
          - {pod: aristo, rotation: 2, seed_base: 20410000}
          - {pod: aristo, rotation: 3, seed_base: 20410000}
          - {pod: artifact, rotation: 0, seed_base: 20510000}
          - {pod: artifact, rotation: 1, seed_base: 20510000}
          - {pod: artifact, rotation: 2, seed_base: 20510000}
          - {pod: artifact, rotation: 3, seed_base: 20510000}
          - {pod: artifact, rotation: 0, seed_base: 20610000}
          - {pod: artifact, rotation: 1, seed_base: 20610000}
          - {pod: artifact, rotation: 2, seed_base: 20610000}
          - {pod: artifact, rotation: 3, seed_base: 20610000}
    steps:
      - uses: actions/checkout@v4
      - name: Run Python tests for V9 logged mulligan evidence
        run: python3 -m unittest discover -s tests -p 'test_brimaz_mulligan_audit.py' -v
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: forge-seven-decks-canonical-verified
          run-id: 37966009166
          github-token: ${{ github.token }}
          path: canonical/
      - name: Verify canonical card lists have not been changed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forge_decks
          cp canonical/forge_normalized/*.dck forge_decks/
          python3 - <<'PY'
          import pathlib,hashlib,json
          d=json.loads(pathlib.Path('canonical/results/forge_normalization/report.json').read_text())
          assert not d['errors'] and len(d['decks'])==7
          for x in d['decks']:
              p=pathlib.Path('forge_decks')/(x['deck']+'.dck')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==x['normalized_sha256']
          PY
      - uses: actions/cache/restore@v4
        with:
          path: forge-dist/
          key: forge-2.0.15-linux-shared-20261009
      - name: Restore pristine Forge
        shell: bash
        run: |
          set -euo pipefail
          if ! find forge-dist -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Patch Charm NPE, preserve V9 strategy and instrument four AIs
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/patch_forge_charm_context.py --jar "$JAR"
          python3 scripts/patch_forge_brimaz_v12.py --jar "$JAR"
      - name: Verify unchanged V9 mulligan decisions against patched V10 Forge
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          mkdir -p test-classes
          javac --release 21 -cp "$JAR" -d test-classes tests/java/forge/ai/BrimazV9MulliganChecks.java
          java -cp "$JAR:test-classes" forge.ai.BrimazV9MulliganChecks
      - name: Verify Incubate API no longer falls back to CannotPlayAi
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          mkdir -p test-classes
          javac --release 21 -cp "$JAR" -d test-classes tests/java/forge/ai/BrimazV12IncubateChecks.java
          java -cp "$JAR:test-classes" forge.ai.BrimazV12IncubateChecks
      - name: Run verified realistic 4-player AI Commander games
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/batch.py --jar "$JAR" --require-canonical-decks \
            --pod "${{ matrix.pod }}" --rotation "${{ matrix.rotation }}" \
            --policy-label V12-incubate --out-tag "V12-large-${{ matrix.seed_base }}" \
            --clock 360 --timeout 445 --seed-base "${{ matrix.seed_base }}" --games-per-rotation 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "brimaz-v12-32-${{ matrix.pod }}-r${{ matrix.rotation }}-s${{ matrix.seed_base }}"
          path: results/batch/
          if-no-files-found: ignore

  certify-and-aggregate:
    needs: v12-campaign
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test independent outcome and campaign evidence processing
        run: |
          python3 -m unittest discover -s tests -p 'test_forge_evidence.py' -v
          python3 -m unittest discover -s tests -p 'test_balanced_commander_campaign.py' -v
      - uses: actions/download-artifact@v4
        with:
          pattern: brimaz-v12-32-*
          path: games/
      - uses: actions/download-artifact@v4
        with:
          name: legality-audit-all-playgroup-pods
          run-id: 37965067128
          github-token: ${{ github.token }}
          path: legality/
      - name: Certify natural Commander outcomes with four loser-or-winner records
        run: python3 scripts/certify_commander_games.py --input games --legality legality/report.json --out results/campaign-32/certification
      - name: Analyze four-seat AI timeouts, mulligans and real Commander pacing
        shell: bash
        run: |
          python3 scripts/analyze_ai_gameplay.py --input games --output results/campaign-32/resolved-actions.json
          python3 scripts/audit_brimaz_windows.py --input games --output results/campaign-32/decision-windows.json
      - name: Verify offline mulligan audit invariants
        run: python3 -m unittest discover -s tests -p 'test_brimaz_mulligan_audit.py' -v
      - name: Verify all-seat evaluation diagnostics parser
        run: python3 -m unittest discover -s tests -p 'test_ai_eval_hotspots.py' -v
      - name: Inspect mulligan decisions and per-seat mana development
        shell: bash
        run: |
          python3 scripts/audit_brimaz_mulligan.py --input games --output results/campaign-32/mulligan-decisions.json
          python3 scripts/audit_ai_eval_hotspots.py --input games --output results/campaign-32/ai-evaluation-hotspots.json
          python3 - <<'PY'
          import pathlib,json
          candidates=list(pathlib.Path("games").rglob("games.json"))
          logs=[]
          for manifest in candidates:
              for game in json.loads(manifest.read_text()):
                  log=manifest.parent/pathlib.Path(game["log"]).name
                  logs.append(log.read_text(errors="replace"))
          assert len(logs)==32,len(logs)
          unsupported=sum(l.count("No AI assigned for API: Incubate") for l in logs)
          print("V12_UNSUPPORTED_INCUBATE_WARNINGS",unsupported)
          assert unsupported==0,"Incubate AI dispatch still missing"
          PY

          python3 scripts/audit_edh_pacing.py --input games --output results/campaign-32/per-seat-pacing.json
      - name: Independently reconcile 16 parallel jobs, 32 matches, four seats and certificate hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_balanced_commander_campaign.py \
            --input games --certificate results/campaign-32/certification/certificate.json \
            --output results/campaign-32/balanced-campaign.json \
            --per-pod-rotation 4 --policy V12-incubate
      - name: Evaluate Incubate event semantics independently of gameplay outcomes
        run: |
          python3 scripts/audit_incubate_support.py --input games \
            --output results/campaign-32/incubate-real-actions.json
      - name: Require 32 complete certification records including any censored and faulty games
        run: |
          python3 - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('results/campaign-32/balanced-campaign.json').read_text())
          assert d['summary']['scheduled']==32
          assert d['summary']['groups_pod_rotation']==8
          assert sum(v['scheduled'] for v in d['by_brimaz_seat'].values())==32
          print('V12_FULL_32_GAME_MATRIX',json.dumps(d['summary'],ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brimaz-v12-32-certified-campaign
          path: results/campaign-32/
          if-no-files-found: ignore
