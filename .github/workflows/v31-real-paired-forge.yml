name: V31 LIVE paired authentic four-AI Forge pilot
on:
  pull_request:
    branches:
      - feature/v30-exact-card-property-fastpath-20261011
    paths:
      - scripts/run_local_four_ai.py
      - scripts/run_paired_four_ai.py
      - scripts/compare_local_four_ai_campaigns.py
      - .github/workflows/v31-real-paired-forge.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v31-one-pod-genuine-paired-operator
  cancel-in-progress: true
jobs:
  real-eight-jvm-commander-pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: forge-seven-decks-canonical-verified
          run-id: 37966009166
          github-token: ${{ github.token }}
          path: canonical/
      - name: Verify exact canonical original seven opponents / Brimaz lists
        run: |
          set -euo pipefail
          mkdir -p forge_decks
          cp canonical/forge_normalized/*.dck forge_decks/
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          report=json.loads(Path('canonical/results/forge_normalization/report.json').read_text())
          assert len(report['decks'])==7 and not report['errors']
          assert all(hashlib.sha256((Path('forge_decks')/(row['deck']+'.dck')).read_bytes()).hexdigest()==row['normalized_sha256'] for row in report['decks'])
          print('V31_SEVEN_ORIGINAL_COMMANDER_DECKS_SHA256_VERIFIED')
          PY
      - uses: actions/cache/restore@v4
        with:
          key: forge-2.0.15-linux-shared-20261009
          path: forge-dist/
      - name: Retrieve and verify pristine official Forge 2.0.15 engine
        run: |
          set -euo pipefail
          if ! find forge-dist -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Run 8 REAL Commander JVMs, 4 seat rotations × original/v30 policy
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit)"
          test -s "$JAR"
          python3 scripts/run_paired_four_ai.py \
            --jar "$JAR" \
            --pod artifact \
            --reference-policy v17_strict \
            --experiment-policy v30_exact_rules \
            --games-per-rotation 1 --parallel 2 --clock 420 \
            --seed-base 20261111 \
            --out results/v31_ci_pairs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v31-eight-real-forge-jvms-original-v30-all-seats
          path: results/v31_ci_pairs/
          retention-days: 30
          if-no-files-found: ignore
