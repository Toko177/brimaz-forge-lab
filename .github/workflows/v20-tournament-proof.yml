name: V20 real Forge tournament aggregator proof
on:
  pull_request:
    branches: [feature/v19-opponent-removal-urgency-20261010]
    paths:
      - scripts/aggregate_four_ai_tournament.py
      - tests/test_aggregate_four_ai_tournament.py
      - .github/workflows/v20-tournament-proof.yml
  workflow_dispatch:
concurrency:
  group: v20-real-tournament-audit
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  archived-real-games:
    name: Verify real 4-AI tournament archive and summary
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject incomplete synthetic unit fixtures
        run: |
          set -euo pipefail
          python3 tests/test_aggregate_four_ai_tournament.py
      - name: Restore the 8 real Forge JVM game logs from a successful run
        uses: actions/download-artifact@v4
        with:
          pattern: four-ai-v17-*
          run-id: 38081333961
          github-token: ${{ github.token }}
          path: actual_forge_archive/
          merge-multiple: false
      - name: Summarize natural outcomes, censures, pods and SHA provenance
        run: |
          set -euo pipefail
          python3 scripts/aggregate_four_ai_tournament.py \
            --input actual_forge_archive/ --out results/v20_archive_proof/ \
            --expected-games 8 --expected-jobs 8
      - name: Publish actual-game evidence and descriptive intervals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-ai-v20-real-tournament-proof
          path: results/v20_archive_proof/
          retention-days: 30
          if-no-files-found: ignore
