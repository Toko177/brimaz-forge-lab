name: Forensic audit of every observed Forge Commander play
on:
  push:
    paths: [.github/workflows/commander-full-playline-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-action-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Verify raw turn, actor, trigger and duplicate protections
        run: python3 -m unittest discover -s tests -p 'test_audit_commander_playlines.py' -v
      - name: Download all 24 actual first tournament games plus 16 second candidate games
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 38040171940 38040810924; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.conclusion')"
            [[ "$conclusion" == success ]] || { echo "Reject unfinished source run $run"; exit 2; }
            mkdir -p "source/$run"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" \
              --pattern 'tournament-real-*' --dir "source/$run"
          done
          python3 - <<'PY'
          from pathlib import Path
          first=list(Path("source/38040171940").rglob("*.log"))
          second=list(Path("source/38040810924").rglob("*.log"))
          assert len(first)==24 and len(second)==16,(len(first),len(second))
          print("AUTHENTIC_FORGE_MOVE_LOGS_FOUND",len(first)+len(second))
          PY
      - name: Reconstruct every cast, land, attack, incubate and end-step proliferate by each AI seat
        run: |
          python3 scripts/audit_commander_playlines.py \
            --input source --output results/play-by-play-every-game.json
          python3 - <<'PY'
          import pathlib,json
          report=json.loads(pathlib.Path('results/play-by-play-every-game.json').read_text())
          assert report['summary']['games']==40
          assert len(report['games'])==40
          print("REAL_COMMANDER_PLAYLINE_GLOBAL_EVIDENCE",
                json.dumps(report['summary'],ensure_ascii=False))
          with open('results/playline-brief.md','w') as fp:
              fp.write("# Brimaz — forensic audit of 40 genuine Commander game logs\n\n")
              fp.write("These are Forge **observed actions**, not legal-alternative snapshots or human gameplay recordings. Matching card choice to human choices requires hand/mana snapshots and same board conditions.\n\n")
              fp.write("| Game | Brimaz player turns | First commander cast | Incubate triggers | Proliferate triggers | Transformed tokens | Outcome |\n")
              fp.write("|---|---:|---:|---:|---:|---:|---|\n")
              for g in report['games']:
                  b=g['brimaz'];o=g['outcomes'].get(str(b['seat']),{}).get('result','unknown')
                  fp.write(f"| {pathlib.Path(g['file']).name} | {b['personal_turns_observed']} | {b['first_commander_cast_personal_turn'] or 'Never'} | {b['incubate_triggers_resolved']} | {b['endstep_proliferate_triggers_resolved']} | {b['incubator_transforms_resolved']} | {o} |\n")
              fp.write("\n**Warning:** 8 original reference transcripts are included once, across four distinct deck candidates; totals across candidate decks do not constitute a 32-game sample of identical decks. Some games can be artificially censored. See independent certificates.\n")
          PY
          cat results/playline-brief.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-40-four-player-games-individual-action-chronology
          path: results/
          if-no-files-found: ignore
