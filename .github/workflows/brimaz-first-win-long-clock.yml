name: Brimaz first-win 900-second reproducibility audit
on:
  push:
    paths:
      - .github/workflows/brimaz-first-win-long-clock.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-original-stock-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: forge-seven-decks-canonical-verified
          run-id: 37966009166
          github-token: ${{ github.token }}
          path: canonical/
      - name: Verify identical SHA-256 for all seven Forge-compatible decks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forge_decks
          cp canonical/forge_normalized/*.dck forge_decks/
          python3 - <<'PY'
          import hashlib,json,pathlib
          data=json.loads(pathlib.Path('canonical/results/forge_normalization/report.json').read_text())
          assert not data['errors'] and len(data['decks'])==7
          for d in data['decks']:
              p=pathlib.Path('forge_decks')/(d['deck']+'.dck')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==d['normalized_sha256']
          PY
      - uses: actions/cache/restore@v4
        with:
          path: forge-dist/
          key: forge-2.0.15-linux-shared-20261009
      - name: Restore pristine authenticated Forge binary when uncached
        shell: bash
        run: |
          set -euo pipefail
          if ! find forge-dist -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Apply only the independently documented Charm engine bugfix
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/patch_forge_charm_context.py --jar "$JAR"
      - name: Replay original Brimaz win seed with longer natural-game clock
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/batch.py --jar "$JAR" --require-canonical-decks \
            --pod aristo --rotation 3 --seed-base 20261010 \
            --games-per-rotation 1 --policy-label charm-stock-clock900 \
            --out-tag charm-stock-clock900 --clock 900 --timeout 1045
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: legality-audit-all-playgroup-pods
          run-id: 37965067128
          github-token: ${{ github.token }}
          path: legality/
      - name: Strictly certify three real loser outcomes and original Brimaz win
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/certify_commander_games.py --input results/batch --legality legality/report.json --out results/first-win-long-clock/
          python3 - <<'PY'
          import json,pathlib
          data=json.loads(pathlib.Path('results/first-win-long-clock/certificate.json').read_text())
          assert data['summary']['checked_games']==1,data['summary']
          assert data['summary']['accepted_brimaz_wins']==1,data
          game=data['games'][0]
          assert game['seed']==20291010 and game['seat']==2,game
          print('900_SECOND_BRIMAZ_WIN_CERTIFIED',json.dumps(game,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-brimaz-win-replay-900s
          path: |
            results/batch/
            results/first-win-long-clock/
          if-no-files-found: ignore
