name: Reconcile V8 and V9 real EDH game pacing
on:
  push:
    paths:
      - .github/workflows/brimaz-v8-v9-paired-pacing.yml
      - scripts/compare_pacing_experiments.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  observational-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test all comparison and Commander pacing parsers
        run: |
          python3 -m unittest discover -s tests -p 'test_compare_pacing_experiments.py' -v
          python3 -m unittest discover -s tests -p 'test_edh_pacing.py' -v
          python3 -m unittest discover -s tests -p 'test_brimaz_mulligan_audit.py' -v
      - uses: actions/download-artifact@v4
        with:
          pattern: brimaz-v8-defense-*
          run-id: 37995083458
          github-token: ${{ github.token }}
          path: v8/
      - uses: actions/download-artifact@v4
        with:
          pattern: brimaz-v9-mulligan-*
          run-id: 37998385269
          github-token: ${{ github.token }}
          path: v9/
      - name: Extract unchanged Forge real-game metrics from the two completed runs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_edh_pacing.py --input v8/ --output results/ab/v8-pacing.json
          python3 scripts/audit_edh_pacing.py --input v9/ --output results/ab/v9-pacing.json
          python3 scripts/audit_brimaz_mulligan.py --input v9/ --output results/ab/v9-mulligans.json
          python3 scripts/compare_pacing_experiments.py \
            --reference results/ab/v8-pacing.json \
            --candidate results/ab/v9-pacing.json \
            --mulligan results/ab/v9-mulligans.json \
            --output results/ab/v8-v9-observational.json
      - name: Confirm comparison only contains four matched and natural Forge matches
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("results/ab/v8-v9-observational.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d['summary']['paired_pod_seed_comparisons']==4,d
          assert d['summary']['both_naturally_completed']==4,d
          assert d['summary']['candidate_games_with_free_mulligan_override']==2,d
          print("FOUR_REAL_GAMES_MATCHED_NO_CAUSAL_INFERENCE",d['summary'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brimaz-v8-v9-observational-campaign-comparison
          path: results/ab/
          if-no-files-found: ignore
