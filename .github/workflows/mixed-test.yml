name: Mixed EDH Forge match (pilot)
on:
  push:
    paths:
      - ".github/workflows/mixed-test.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  mixed-four-player:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore validated Krenko and Muldrotha decks
        uses: actions/download-artifact@v4
        with:
          name: bracket3-opponent-imports
          run-id: 37951046439
          github-token: ${{ github.token }}
          path: .
      - name: Validate saved opponent decks
        run: |
          test -f forge_decks/Krenko_B3.dck
          test -f forge_decks/Muldrotha_B3.dck
          cat results/panel.json
      - name: Fetch and verify Forge 2.0.15
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 25 --max-time 480 -o forge.tar.bz2 'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
          echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
          mkdir -p forge-dist
          tar -xjf forge.tar.bz2 -C forge-dist
      - name: Simulate Brimaz versus Krenko and Muldrotha (pilot only)
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          test -n "$JAR"
          python3 scripts/smoke.py --jar "$JAR" --games 1 --clock 360 --timeout 450 --opponents Krenko_B3 Muldrotha_B3 Krenko_B3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-forge-pilot-results
          path: |
            results/smoke.json
            results/forge-smoke.log
          if-no-files-found: ignore
