name: Validate Brimaz V3 tactical AI
on:
  push:
    paths:
      - ".github/workflows/brimaz-v3-validation.yml"
      - "scripts/patch_forge_brimaz_v3.py"
      - "tests/java/forge/ai/BrimazV3ScoringChecks.java"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: kaal-playgroup-deck-snapshots
          run-id: 37952122924
          github-token: ${{ github.token }}
          path: .
      - uses: actions/cache/restore@v4
        with:
          path: forge-dist/
          key: forge-2.0.15-linux-shared-20261009
      - name: Download original Forge when not cached
        shell: bash
        run: |
          set -euo pipefail
          if ! find forge-dist -name "forge-gui-desktop-*-jar-with-dependencies.jar" -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 "https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2"
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Compile the V3 custom AI against Forge's real Java classes
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/patch_forge_brimaz_v3.py --jar "$JAR"
          mkdir -p tests-classes
          javac --release 21 -cp "$JAR" -d tests-classes tests/java/forge/ai/BrimazV3ScoringChecks.java
          java -cp "$JAR:tests-classes" forge.ai.BrimazV3ScoringChecks
      - name: Prove Commander game finishes naturally with V3
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/smoke.py --jar "$JAR" --games 1 --clock 360 --timeout 450 --opponents Kaal_9594008 Kaal_10347090 Kaal_21930525
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brimaz-v3-validation-data
          path: |
            results/
          if-no-files-found: ignore
