name: Brimaz V9 conservative free-mulligan four-AI pilot
on:
  push:
    paths: [.github/workflows/brimaz-v9-mulligan-pilot.yml, scripts/patch_forge_brimaz_v9.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  v9-pilot:
    name: "${{ matrix.pod }} rotation ${{ matrix.rotation }}"
    runs-on: ubuntu-latest
    timeout-minutes: 19
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {pod: aristo, rotation: 2}
          - {pod: artifact, rotation: 2}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: forge-seven-decks-canonical-verified
          run-id: 37966009166
          github-token: ${{ github.token }}
          path: canonical/
      - name: Verify canonical card lists have not been changed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forge_decks
          cp canonical/forge_normalized/*.dck forge_decks/
          python3 - <<'PY'
          import pathlib,hashlib,json
          d=json.loads(pathlib.Path('canonical/results/forge_normalization/report.json').read_text())
          assert not d['errors'] and len(d['decks'])==7
          for x in d['decks']:
              p=pathlib.Path('forge_decks')/(x['deck']+'.dck')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==x['normalized_sha256']
          PY
      - uses: actions/cache/restore@v4
        with:
          path: forge-dist/
          key: forge-2.0.15-linux-shared-20261009
      - name: Restore pristine Forge
        shell: bash
        run: |
          set -euo pipefail
          if ! find forge-dist -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Patch Charm NPE and install V9 Brimaz-only mulligan policy
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/patch_forge_charm_context.py --jar "$JAR"
          python3 scripts/patch_forge_brimaz_v9.py --jar "$JAR"
      - name: Run pure V9 mulligan decision tests against patched Forge class
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          mkdir -p test-classes
          javac --release 21 -cp "$JAR" -d test-classes tests/java/forge/ai/BrimazV9MulliganChecks.java
          java -cp "$JAR:test-classes" forge.ai.BrimazV9MulliganChecks
      - name: Run verified realistic 4-player AI Commander games
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/batch.py --jar "$JAR" --require-canonical-decks \
            --pod "${{ matrix.pod }}" --rotation "${{ matrix.rotation }}" \
            --policy-label V9-mulligan --out-tag V9-mulligan \
            --clock 360 --timeout 445 --seed-base 20261009 --games-per-rotation 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "brimaz-v9-mulligan-${{ matrix.pod }}-${{ matrix.rotation }}"
          path: results/batch/
          if-no-files-found: ignore

  audit-windows:
    needs: v9-pilot
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: brimaz-v9-mulligan-*
          path: games/
      - uses: actions/download-artifact@v4
        with:
          name: legality-audit-all-playgroup-pods
          run-id: 37965067128
          github-token: ${{ github.token }}
          path: legality/
      - name: Certify natural Commander outcomes with four loser-or-winner records
        run: python3 scripts/certify_commander_games.py --input games --legality legality/report.json --out results/v9/certification
      - name: Analyze real actions, mulligans and per-seat Commander pacing
        shell: bash
        run: |
          python3 scripts/analyze_ai_gameplay.py --input games --output results/v9/resolved-actions.json
          python3 scripts/audit_brimaz_windows.py --input games --output results/v9/decision-windows.json
      - name: Inspect mulligan decisions and per-seat mana development
        shell: bash
        run: |
          python3 scripts/audit_brimaz_mulligan.py --input games --output results/v9/mulligan-decisions.json
          python3 scripts/audit_edh_pacing.py --input games --output results/v9/per-seat-pacing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brimaz-v9-mulligan-audit
          path: results/v9/
          if-no-files-found: ignore
