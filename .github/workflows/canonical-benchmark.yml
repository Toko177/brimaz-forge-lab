name: Certified Commander benchmark — canonical decks
on:
  push:
    paths: [".github/workflows/canonical-benchmark.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  match-shard:
    name: "${{ matrix.policy }} / ${{ matrix.pod }} / seat ${{ matrix.rotation }}"
    runs-on: ubuntu-latest
    timeout-minutes: 26
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        policy: [stock, V4]
        pod: [aristo, artifact]
        rotation: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: forge-seven-decks-canonical-verified
          run-id: 37966009166
          github-token: ${{ github.token }}
          path: canonical/
      - name: Verify all canonical card names and audit digest before experiment
        shell: bash
        run: |
          set -euo pipefail
          test -f canonical/forge_normalized/Brimaz_V3.dck
          test -f canonical/results/forge_normalization/report.json
          mkdir -p forge_decks
          cp canonical/forge_normalized/*.dck forge_decks/
          python3 - <<'PY'
          import pathlib,hashlib,json
          report=json.loads(pathlib.Path("canonical/results/forge_normalization/report.json").read_text())
          assert not report["errors"],report["errors"]
          assert len(report["decks"])==7
          for row in report["decks"]:
              file=pathlib.Path("forge_decks")/(row["deck"]+".dck")
              assert hashlib.sha256(file.read_bytes()).hexdigest()==row["normalized_sha256"],file
          print("CANONICAL_INPUTS_VERIFIED",len(report["decks"]),flush=True)
          PY
      - uses: actions/cache/restore@v4
        with:
          path: forge-dist/
          key: forge-2.0.15-linux-shared-20261009
      - name: Obtain authentic Forge release when uncached
        shell: bash
        run: |
          set -euo pipefail
          if ! find forge-dist -name "forge-gui-desktop-*-jar-with-dependencies.jar" -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 "https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2"
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Apply ONLY V4 AI heuristic on V4 arm, original rules unchanged
        if: matrix.policy == 'V4'
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/patch_forge_brimaz_v4.py --jar "$JAR"
      - name: Run two independent seeded 4-AI Commander games
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/batch.py --jar "$JAR" \
            --pod "${{ matrix.pod }}" \
            --rotation "${{ matrix.rotation }}" \
            --profile-brimaz Default --profile-opponents Default \
            --policy-label "canonical-${{ matrix.policy }}" \
            --out-tag "canonical-${{ matrix.policy }}" \
            --seed-base 20261009 --clock 360 --timeout 445 --games-per-rotation 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "canonical-match-${{ matrix.policy }}-${{ matrix.pod }}-${{ matrix.rotation }}"
          path: results/batch/${{ matrix.pod }}/canonical-${{ matrix.policy }}/
          if-no-files-found: ignore
  aggregate-and-certify:
    needs: [match-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: canonical-match-*
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: legality-audit-all-playgroup-pods
          run-id: 37965067128
          github-token: ${{ github.token }}
          path: legality/
      - name: Collect 32 real Forge results without inventing timed wins
        run: python3 scripts/aggregate_batch.py --input artifacts --expected-groups 4 --expected-per-group 8 --output results/canonical/aggregate.json
      - name: Reject incomplete games, engine exceptions, or decks not checked by Scryfall
        run: python3 scripts/certify_commander_games.py --input artifacts --legality legality/report.json --out results/canonical/verified
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-commander-genuine-match-report
          path: results/canonical/
          if-no-files-found: ignore
