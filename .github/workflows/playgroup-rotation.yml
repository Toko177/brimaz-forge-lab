name: Brimaz vs playgroup - four seat rotation
on:
  push:
    paths:
      - ".github/workflows/playgroup-rotation.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  playgroup-rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore source-pinned playgroup decks
        uses: actions/download-artifact@v4
        with:
          name: kaal-playgroup-deck-snapshots
          run-id: 37952122924
          github-token: ${{ github.token }}
          path: .
      - name: Obtain and verify original Forge distribution
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 25 --max-time 480 -o forge.tar.bz2 'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
          echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
          mkdir -p forge-dist
          tar -xjf forge.tar.bz2 -C forge-dist
      - name: Run 4 complete EDH matches with Brimaz seat rotation
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          test -n "$JAR"
          python3 scripts/batch.py --jar "$JAR" --pod aristo --clock 360 --timeout 445 --games-per-rotation 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brimaz-playgroup-rotated-four-games
          path: results/batch/aristo/
          if-no-files-found: ignore
