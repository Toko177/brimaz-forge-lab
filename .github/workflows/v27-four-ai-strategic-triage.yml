name: V27 authentic four-AI strategic game diagnostics from 16 raw games
on:
  pull_request:
    branches: [feature/v26-real-forge-jfr-cpu-20261011]
    paths:
      - .github/workflows/v27-four-ai-strategic-triage.yml
      - scripts/triage_real_four_ai_strategy.py
      - scripts/assess_simulator_readiness.py
      - tests/test_assess_simulator_readiness.py
      - tests/test_triage_real_four_ai_strategy.py
      - scripts/first_real_four_ai_divergence.py
      - tests/test_first_real_four_ai_divergence.py
  workflow_dispatch:
concurrency:
  group: v27-raw-four-seat-action-triage
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  strategic-evidence:
    name: Audit 16 archived real Forge 4-AI game logs (no proxy/sim)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate explicit synthetic-only forensic parser tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/triage_real_four_ai_strategy.py scripts/forensic_four_seat.py
          python3 tests/test_triage_real_four_ai_strategy.py
          python3 tests/test_assess_simulator_readiness.py
          python3 tests/test_first_real_four_ai_divergence.py
          python3 tests/test_forensic_four_seat.py
          python3 tests/test_aggregate_four_ai_tournament.py
      - name: Obtain exactly sixteen original Forge 2.0.15 four-AI JVM game logs
        uses: actions/download-artifact@v4
        with:
          run-id: 38094639616
          github-token: ${{ github.token }}
          pattern: four-ai-v25-trigger-*
          path: downloaded/
      - name: Verify genuine four-player games and compile all-seat timeline forensic
        run: |
          set -euo pipefail
          python3 scripts/aggregate_four_ai_tournament.py \
            --input downloaded/ --out results/v27_real_strategic/ \
            --expected-jobs 16 --expected-games 16
          python3 scripts/forensic_four_seat.py \
            --input downloaded/ --output results/v27_real_strategic/
          python3 scripts/triage_real_four_ai_strategy.py \
            --input results/v27_real_strategic/four_seat_actions.json \
            --output results/v27_real_strategic/
          python3 scripts/first_real_four_ai_divergence.py \
            --input downloaded/ \
            --output results/v27_real_strategic/first_gameplay_divergence.json
          python3 - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path("results/v27_real_strategic/first_gameplay_divergence.json").read_text())
          for d in x["differences"]:
            if d["entire_observable_event_sequences_equal"]:continue
            print("FOUR_AI_AUTHENTIC_FIRST_GAMEPLAY_DIFFERENCE",json.dumps({
              "pod":d["pod"],"rotation":d["rotation"],"seed":d["seed"],
              "index":d["first_mismatch_index"],
              "base_first_event":d["reference_at_mismatch"],
              "optimized_first_event":d["experimental_at_mismatch"],
              "previous_base":d["reference_preceding_events"],
              "previous_opt":d["experimental_preceding_events"],
              "base_following":d["reference_following_events"],
              "optimized_following":d["experimental_following_events"],
              "timeouts_already_happened":[d["reference_timeouts_before_mismatch"],
                 d["experimental_timeouts_before_mismatch"]]
            },ensure_ascii=False))
          PY
          python3 scripts/analyze_four_ai_timeout_stacks.py \
            --input downloaded/ --out results/v27_real_strategic/
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("results/v27_real_strategic")
          game=json.loads((p/"tournament.json").read_text())
          triage=json.loads((p/"strategic_triage.json").read_text())
          divergence=json.loads((p/"first_gameplay_divergence.json").read_text())
          assert divergence["real_forge_four_ai_games_compared"]==16
          assert game["games_started"]==16 and triage["game_count"]==16
          assert len(triage["per_deck"])==7
          assert len(triage["pod_counts"])==2
          print("FOUR_AI_REAL_STRATEGIC_DIAGNOSTIC_PASS",json.dumps({
             "real_games":16,
             "natural":game["games_naturally_complete_unindependently_certified"],
             "censored_or_fault":game["censored_or_engine_failed_count"],
             "suspected_issues":triage["prioritized_investigations"],
             "natural_changed_winner_pairs":divergence["different_natural_winner_pairs"],
          }))
          PY
      - name: Enforce correctly censored exploratory engine readiness without claiming human-like AI
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/assess_simulator_readiness.py \
             --forensics results/v27_real_strategic/four_seat_actions.json \
             --out results/v27_real_strategic/readiness.json
          python3 - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path("results/v27_real_strategic/readiness.json").read_text())
          assert x["engine_pilot_gate"]=="PASS",x["blocking_issues"]
          assert x["expected_clock_censored_games_kept_in_denominator"]==2
          assert x["statistically_validated_brimaz_winrate"] is False
          assert x["human_like_ai_demonstrated"] is False
          print("FOUR_AI_V27_EXPLORATORY_ENGINE_PILOT_READY_WITH_CENSORS",x["game_count"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v27-genuine-sixteen-game-strategic-diagnostics
          path: results/v27_real_strategic/
          retention-days: 30
          if-no-files-found: ignore
