name: Certify historical Forge Commander outcomes
on:
  push:
    paths: [".github/workflows/realism-certification.yml", "scripts/certify_commander_games.py"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: legality-audit-all-playgroup-pods
          run-id: 37965067128
          github-token: ${{ github.token }}
          path: legality/
      - uses: actions/download-artifact@v4
        with:
          pattern: brimaz-planner-v3-*
          run-id: 37962437566
          github-token: ${{ github.token }}
          path: matches/
      - name: Validate natural wins, game integrity and legality evidence
        run: python3 scripts/certify_commander_games.py --input matches --legality legality/report.json --out results/certification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-natural-commander-games
          path: results/certification/
          if-no-files-found: ignore
