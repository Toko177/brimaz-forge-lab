name: Extended Commander game-clock regression after Charm fix
on:
  push:
    paths:
      - .github/workflows/charm-longgame-regression.yml
      - scripts/patch_forge_charm_context.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    name: "${{ matrix.policy }} seed ${{ matrix.seed }} rotation ${{ matrix.rotation }}"
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {policy: stock, rotation: 0, seed: 20261009}
          - {policy: V4, rotation: 3, seed: 20291010}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: forge-seven-decks-canonical-verified
          run-id: 37966009166
          github-token: ${{ github.token }}
          path: canonical/
      - name: Restore exact seven canonical Forge decks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forge_decks
          cp canonical/forge_normalized/*.dck forge_decks/
          python3 - <<'PY'
          import pathlib,hashlib,json
          x=json.loads(pathlib.Path('canonical/results/forge_normalization/report.json').read_text())
          assert len(x['decks'])==7
          for d in x['decks']:
              p=pathlib.Path('forge_decks')/(d['deck']+'.dck')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==d['normalized_sha256']
          PY
      - uses: actions/cache/restore@v4
        with:
          path: forge-dist/
          key: forge-2.0.15-linux-shared-20261009
      - name: Download verified original Forge on cache miss
        shell: bash
        run: |
          set -euo pipefail
          if ! find forge-dist -name "forge-gui-desktop-*-jar-with-dependencies.jar" -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Compile only CharmEffect NPE bugfix
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/patch_forge_charm_context.py --jar "$JAR"
      - name: Add V4 strategy policy in its respective regression arm
        if: matrix.policy == 'V4'
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/patch_forge_brimaz_v4.py --jar "$JAR"
      - name: Retry previously stuck game with 600s natural-play window
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          BASE=$((${{ matrix.seed }} - 10000 * ${{ matrix.rotation }}))
          python3 scripts/batch.py --jar "$JAR" --require-canonical-decks \
            --pod aristo --rotation "${{ matrix.rotation }}" \
            --seed-base "$BASE" --games-per-rotation 1 \
            --policy-label "charm-fix-${{ matrix.policy }}" --out-tag "charm-fix-${{ matrix.policy }}" \
            --clock 600 --timeout 700
          python3 - <<'PY'
          import pathlib,json
          logs=list(pathlib.Path('results/batch/aristo').rglob('game_*.log'))
          assert len(logs)==1
          raw=logs[0].read_text()
          for pattern in ['NullPointerException','IllegalStateException','Exception in thread']:
              assert pattern not in raw, f'UNRESOLVED_FORGE_ENGINE_ERROR: {pattern}'
          games=list(pathlib.Path('results/batch/aristo').rglob('games.json'))
          g=json.loads(games[0].read_text())[0]
          print('CHARM_NPE_REGRESSION',json.dumps({
              'status':g['status'],'seed':g['seed'],'winner':g.get('winner_deck'),
              'brimaz_win':g.get('brimaz_win')},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "charm-extended-${{ matrix.policy }}-${{ matrix.seed }}"
          path: results/batch/
          if-no-files-found: ignore
