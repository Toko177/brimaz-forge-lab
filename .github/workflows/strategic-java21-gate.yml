name: V35 4-AI strategic search Java21 compile and adversarial tests
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/patch_forge_brimaz_v13.py
      - scripts/run_local_four_ai.py
      - patches/java/forge/ai/MultiplayerStrategicModel.java
      - patches/java/forge/ai/MultiplayerStrategicSequencer.java
      - tests/java/forge/ai/MultiplayerStrategicModelChecks.java
      - patches/java/forge/ai/MultiplayerStrategicSearchV35.java
      - patches/java/forge/ai/MultiplayerStrategicSequencerV35.java
      - patches/java/forge/ai/MultiplayerTacticalPlannerV35.java
      - tests/java/forge/ai/MultiplayerTacticalPlannerV35Checks.java
      - scripts/audit_v35_real_search.py
      - tests/java/forge/ai/MultiplayerStrategicSearchV35Checks.java
      - .github/workflows/strategic-java21-gate.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-java21-forge-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test pure abstract two-turn scenarios (not real matches)
        run: |
          set -euo pipefail
          mkdir -p /tmp/v33-model
          javac --release 21 -d /tmp/v33-model \
            patches/java/forge/ai/MultiplayerStrategicModel.java \
            patches/java/forge/ai/MultiplayerStrategicSearchV35.java \
            tests/java/forge/ai/MultiplayerStrategicModelChecks.java \
            tests/java/forge/ai/MultiplayerStrategicSearchV35Checks.java
          java -cp /tmp/v33-model forge.ai.MultiplayerStrategicModelChecks
          java -cp /tmp/v33-model forge.ai.MultiplayerStrategicSearchV35Checks
      - name: Check pinned canonical files and Python operator controls
        run: |
          python3 tests/test_run_local_four_ai.py
          python3 tests/test_v31_paired_four_ai.py
          python3 tests/test_audit_v35_real_search.py
          python3 -m py_compile scripts/patch_forge_brimaz_v13.py scripts/run_local_four_ai.py scripts/audit_v35_real_search.py
      - uses: actions/cache/restore@v4
        with:
          key: forge-2.0.15-linux-shared-20261009
          path: forge-dist/
      - name: Recover pinned official Java21 Forge executable
        run: |
          set -euo pipefail
          if ! find forge-dist -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Compile complete AiController V13 + NEW 4-AI strategic planner
        run: |
          set -euo pipefail
          ORIG="$(find "$PWD/forge-dist" -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit)"
          test -s "$ORIG"
          cp "$ORIG" /tmp/v33-test.jar
          python3 scripts/patch_forge_charm_context.py --jar /tmp/v33-test.jar
          python3 scripts/patch_forge_brimaz_v13.py --jar /tmp/v33-test.jar
          python3 scripts/patch_forge_multiplayer_removal.py --jar /tmp/v33-test.jar
          python3 scripts/patch_forge_counter_critical.py --jar /tmp/v33-test.jar
          javap -classpath /tmp/v33-test.jar forge.ai.MultiplayerRemovalUrgencyPolicy |
            grep -F 'publicThreatBonus('
          javap -classpath /tmp/v33-test.jar forge.ai.ability.MultiplayerCriticalCounterPolicy |
            grep -F 'isCommanderRemovalThreat('
          javap -classpath /tmp/v33-test.jar forge.ai.MultiplayerTacticalPlannerV35 |
            grep -F 'choosePublicAction('
          javap -classpath /tmp/v33-test.jar forge.ai.MultiplayerStrategicSequencerV35 |
            grep -F 'rank(forge.game.player.Player,'
          mkdir -p /tmp/v33-tests
          javac --release 21 -cp /tmp/v33-test.jar -d /tmp/v33-tests \
            tests/java/forge/ai/MultiplayerStrategicModelChecks.java
          java -cp "/tmp/v33-test.jar:/tmp/v33-tests" forge.ai.MultiplayerStrategicModelChecks
          javac --release 21 -cp /tmp/v33-test.jar -d /tmp/v33-tests \
            tests/java/forge/ai/MultiplayerStrategicSearchV35Checks.java
          java -cp "/tmp/v33-test.jar:/tmp/v33-tests" forge.ai.MultiplayerStrategicSearchV35Checks
          javac --release 21 -cp /tmp/v33-test.jar -d /tmp/v33-tests \
            tests/java/forge/ai/MultiplayerTacticalPlannerV35Checks.java
          java -cp "/tmp/v33-test.jar:/tmp/v33-tests" forge.ai.MultiplayerTacticalPlannerV35Checks

      - name: Diagnose failed Forge A/B archives without changing evidence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess
          cases=[
            "v35-v17_strict-vs-v35_brimaz_duel-artifact",
            "v35-forge_stock-vs-v35_strategy-aristo",
          ]
          for i,name in enumerate(cases):
              folder=pathlib.Path("/tmp/v35_failed_archive")/str(i)
              folder.mkdir(parents=True,exist_ok=True)
              result=subprocess.run(["gh","run","download","38136545704",
                   "--name",name,"--dir",str(folder)],capture_output=True,
                   text=True,timeout=160)
              print("FAILED_V35_ARCHIVE",name,"download_rc",result.returncode,flush=True)
              if result.returncode:
                  print(result.stderr[-450:],flush=True)
                  continue
              files=list(folder.rglob("stderr.log"))+list(folder.rglob("stdout.log"))
              print("FAILED_V35_LOG_FILES",len(files),flush=True)
              for path in files:
                  raw=path.read_text(encoding="utf-8",errors="replace")
                  lines=raw.splitlines()
                  relevant=[l for l in lines if any(k in l for k in (
                      "Traceback","Error:","Exception","RuntimeError","FileNotFound",
                      "ValueError","AssertionError","not found","MemoryError",
                      "Killed","OOM","FAILED","failed","returncode","FATAL",
                      "error:","unparsed","clock_censored","engine_error",
                      "REAL_FOUR_AI_MATRIX","FOUR_AI_LOCAL_PREFLIGHT",
                      "FOUR_AI_EXPLORATORY_READINESS_GATE"))]
                  if not relevant and not path.name.endswith("stderr.log"):continue
                  print("FAILED_V35_LOG",str(path.relative_to(folder)),
                        "lines",len(lines),"relevant",len(relevant),flush=True)
                  for item in relevant[-9:]:
                      print("  ",item[:260],flush=True)
                  for item in lines[-5:]:
                      print("  TAIL",item[:240],flush=True)
          PY
