name: Brimaz V5 commander and Incubator AI pilot
on:
  push:
    paths: [.github/workflows/brimaz-v5-pilot.yml, scripts/patch_forge_brimaz_v5.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ai-v5:
    name: "${{ matrix.pod }} rotation ${{ matrix.rotation }}"
    runs-on: ubuntu-latest
    timeout-minutes: 19
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {pod: aristo, rotation: 2}
          - {pod: artifact, rotation: 2}
          - {pod: aristo, rotation: 1}
          - {pod: artifact, rotation: 1}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: forge-seven-decks-canonical-verified
          run-id: 37966009166
          github-token: ${{ github.token }}
          path: canonical/
      - name: Verify canonical card lists have not been changed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forge_decks
          cp canonical/forge_normalized/*.dck forge_decks/
          python3 - <<'PY'
          import pathlib,hashlib,json
          d=json.loads(pathlib.Path('canonical/results/forge_normalization/report.json').read_text())
          assert not d['errors'] and len(d['decks'])==7
          for x in d['decks']:
              p=pathlib.Path('forge_decks')/(x['deck']+'.dck')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==x['normalized_sha256']
          PY
      - uses: actions/cache/restore@v4
        with:
          path: forge-dist/
          key: forge-2.0.15-linux-shared-20261009
      - name: Restore pristine Forge
        shell: bash
        run: |
          set -euo pipefail
          if ! find forge-dist -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Patch exact known targeting NPE and install V5 decision policy
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/patch_forge_charm_context.py --jar "$JAR"
          python3 scripts/patch_forge_brimaz_v5.py --jar "$JAR"
      - name: Run verified realistic 4-player AI Commander games
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/batch.py --jar "$JAR" --require-canonical-decks \
            --pod "${{ matrix.pod }}" --rotation "${{ matrix.rotation }}" \
            --policy-label V5-charm-fixed --out-tag V5-charm-fixed \
            --clock 360 --timeout 445 --seed-base 20261009 --games-per-rotation 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "brimaz-v5-${{ matrix.pod }}-${{ matrix.rotation }}"
          path: results/batch/
          if-no-files-found: ignore
