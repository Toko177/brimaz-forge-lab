name: V32 pin canonical seven real Commander decks permanently
on:
  push:
    branches:
      - feature/v32-persistent-canonical-commander-decks-20261011
    paths:
      - .github/workflows/v32-pin-seven-decks.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify-and-vendor-on-feature-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feature/v32-persistent-canonical-commander-decks-20261011
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: forge-seven-decks-canonical-verified
          run-id: 37966009166
          github-token: ${{ github.token }}
          path: original/
      - name: Only use the seven exact canonical original deck bytes, fail closed
        run: |
          set -euo pipefail
          mkdir -p forge_decks canonical/results/forge_normalization
          python3 - <<'PY'
          import hashlib,json, pathlib,shutil
          src=pathlib.Path("original/forge_normalized")
          reportfile=pathlib.Path("original/results/forge_normalization/report.json")
          report=json.loads(reportfile.read_text(encoding="utf-8"))
          expected={"Brimaz_V3","Kaal_9594008","Kaal_10347090",
                    "Kaal_21930525","Kaal_23328062","Kaal_11485202",
                    "Kaal_22193355"}
          rows=report.get("decks",[])
          assert not report.get("errors") and len(rows)==7
          assert {r["deck"] for r in rows}==expected
          assert {f.stem for f in src.glob("*.dck")}==expected
          for row in rows:
              deck=row["deck"]
              f=src/(deck+".dck")
              raw=f.read_bytes()
              digest=hashlib.sha256(raw).hexdigest()
              assert digest==row["normalized_sha256"], ("SHA mismatch",deck)
              assert b"[Commander]" in raw and b"[Main]" in raw
              target=pathlib.Path("forge_decks")/(deck+".dck")
              target.write_bytes(raw)
              assert hashlib.sha256(target.read_bytes()).hexdigest()==digest
              print("V32_CANONICAL_DECK_SHA256",deck,digest)
          dst=pathlib.Path("canonical/results/forge_normalization/report.json")
          shutil.copyfile(reportfile,dst)
          assert json.loads(dst.read_text())==report
          print("V32_SEVEN_CANONICAL_DECKS_PINNED_VERIFIED")
          PY
      - name: Commit only seven verified decks and report to V32 feature branch
        env:
          BRANCH: feature/v32-persistent-canonical-commander-decks-20261011
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forge_decks/*.dck canonical/results/forge_normalization/report.json
          if ! git diff --cached --quiet; then
            git commit -m 'V32: permanently pin 7 SHA256-verified original Commander decklists'
            git push origin "HEAD:$BRANCH"
          fi
      - name: Refuse empty tracked deck set
        run: |
          set -euo pipefail
          test "$(git ls-files 'forge_decks/*.dck' | wc -l)" -eq 7
          test -f canonical/results/forge_normalization/report.json
          echo V32_DECKS_VERIFIED_AND_COMMITTED
