name: Experimental four-opponent Forge hybrid decision test
on:
  push:
    paths:
      - ".github/workflows/edh-four-player-hybrid.yml"
      - "scripts/patch_forge_4player_stack.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  four-player-hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: kaal-playgroup-deck-snapshots
          run-id: 37952122924
          github-token: ${{ github.token }}
          path: .
      - uses: actions/cache/restore@v4
        with:
          path: forge-dist/
          key: forge-2.0.15-linux-shared-20261009
      - name: Obtain exact original Forge version
        shell: bash
        run: |
          set -euo pipefail
          if ! find forge-dist -name "forge-gui-desktop-*-jar-with-dependencies.jar" -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 "https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2"
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Compile four-player stack controller support in cloned Forge engine
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/patch_forge_4player_stack.py --jar "$JAR"
      - name: Execute opt-in full-state hybrid decision experiment
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/smoke.py --jar "$JAR" --hybrid-ai --games 1 --clock 300 --timeout 375 --opponents Kaal_9594008 Kaal_10347090 Kaal_21930525 || true
          test -f results/smoke.json
          cat results/smoke.json
          if grep -q "EDH_HYBRID_EXPERIMENT:" results/forge-smoke.log; then
            echo "HYBRID_ACTIVATION_CONFIRMED"
          else
            echo "HYBRID_NOT_ENABLED" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-four-player-hybrid-trace
          path: results/
          if-no-files-found: ignore
