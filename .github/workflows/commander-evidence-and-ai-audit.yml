name: Commander regression suite and V6 real-action certification
on:
  push:
    paths:
      - .github/workflows/commander-evidence-and-ai-audit.yml
      - scripts/forge_result_evidence.py
      - scripts/certify_commander_games.py
      - scripts/analyze_ai_gameplay.py
      - tests/test_forge_evidence.py
      - tests/test_matched_replay.py
      - tests/test_edh_pacing.py
      - tests/test_brimaz_mulligan_audit.py
      - tests/test_compare_pacing_experiments.py
      - tests/test_ai_eval_hotspots.py
      - tests/test_adaptive_ai_budget.py
      - tests/test_incubate_support.py
      - tests/test_balanced_commander_campaign.py
      - tests/test_same_seed_campaign.py
      - tests/test_brimaz_combat.py
      - tests/test_missing_ai_handlers.py
      - scripts/audit_missing_ai_handlers.py
      - scripts/audit_brimaz_combat.py
      - scripts/audit_same_seed_campaign.py
      - scripts/audit_balanced_commander_campaign.py
      - scripts/audit_incubate_support.py
      - scripts/audit_adaptive_ai_budget.py
      - scripts/audit_ai_eval_hotspots.py
      - scripts/audit_matched_replay.py
      - scripts/audit_edh_pacing.py
      - scripts/audit_brimaz_mulligan.py
      - scripts/compare_pacing_experiments.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  regress-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run all deterministic Python regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/download-artifact@v4
        with:
          pattern: brimaz-v6-*
          run-id: 37969934893
          github-token: ${{ github.token }}
          path: v6-games/
      - uses: actions/download-artifact@v4
        with:
          name: legality-audit-all-playgroup-pods
          run-id: 37965067128
          github-token: ${{ github.token }}
          path: legality/
      - name: Independently check real four-player outcomes and configured clock
        run: python3 scripts/certify_commander_games.py --input v6-games --legality legality/report.json --out results/evidence/certificates
      - name: Report observed Brimaz actions from real V6 stack traces
        run: python3 scripts/analyze_ai_gameplay.py --input v6-games --output results/evidence/ai-actions.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commander-evidence-and-v6-real-actions
          path: results/evidence/
          if-no-files-found: ignore
