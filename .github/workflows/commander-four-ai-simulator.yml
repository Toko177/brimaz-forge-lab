name: Commander four-AI manual real Forge games
on:
  workflow_dispatch:
    inputs:
      pod:
        description: Opponents
        type: choice
        options: [both, aristo, artifact]
        default: both
        required: true
      policy:
        description: Shared four-seat AI policy
        type: choice
        options: [v17_strict, v19_removal, v20_shadow, critical_counter, v23_cooldown, v24_trigger_prune, v30_exact_rules, v30_shadow_verify, v33_strategy]
        default: v33_strategy
        required: true
      reference_policy:
        description: Baseline for paired A/B
        type: choice
        options: [v17_strict, v19_removal, v24_trigger_prune, v30_exact_rules]
        default: v17_strict
        required: true
      paired:
        description: Run A/B comparison instead of single policy
        type: boolean
        default: true
        required: true
      games_per_rotation:
        type: choice
        options: ["1", "2"]
        default: "1"
        required: true
      profile:
        type: choice
        options: [Default, Experimental, Cautious, Reckless]
        default: Default
        required: true
      clock_seconds:
        type: choice
        options: ["360", "420"]
        default: "420"
        required: true
      seed_base:
        type: string
        default: "20261221"
        required: true
permissions:
  contents: read
concurrency:
  group: manual-four-ai-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  genuine-forge-four-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 49
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          key: forge-2.0.15-linux-shared-20261009
          path: forge-dist/
      - name: Restore original pinned Forge 2.0.15
        shell: bash
        run: |
          set -euo pipefail
          if ! find forge-dist -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Verify canonical seven decks
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from run_local_four_ai import validate_decks, ROOT
          result=validate_decks(ROOT/'forge_decks', ROOT/'canonical/results/forge_normalization/report.json')
          assert len(result)==7
          print('FORGE_ORIGINAL_SEVEN_SHA256_VERIFIED')
          PY
      - name: Run genuine Forge JVM tournament
        env:
          POD: ${{ inputs.pod }}
          POLICY: ${{ inputs.policy }}
          REFERENCE: ${{ inputs.reference_policy }}
          PAIRED: ${{ inputs.paired }}
          GAMES: ${{ inputs.games_per_rotation }}
          PROFILE: ${{ inputs.profile }}
          CLOCK: ${{ inputs.clock_seconds }}
          SEED: ${{ inputs.seed_base }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit)"
          test -s "$JAR"
          if [[ ! "$SEED" =~ ^[0-9]+$ ]] || (( SEED < 1 || SEED > 2000000000 )); then
            echo 'Invalid positive seed base' >&2
            exit 2
          fi
          mkdir -p results/manual
          if [ "$PAIRED" = "true" ]; then
            python3 scripts/run_paired_four_ai.py --jar "$JAR" \
              --pod "$POD" --reference-policy "$REFERENCE" \
              --experiment-policy "$POLICY" --profile "$PROFILE" \
              --games-per-rotation "$GAMES" --parallel 2 \
              --clock "$CLOCK" --seed-base "$SEED" --out results/manual
          else
            python3 scripts/run_local_four_ai.py --jar "$JAR" \
              --pod "$POD" --policy "$POLICY" --profile "$PROFILE" \
              --games-per-rotation "$GAMES" --parallel 2 \
              --clock "$CLOCK" --seed-base "$SEED" \
              --campaign-root results/manual
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genuine-commander-four-ai-${{ github.run_id }}
          path: results/manual/
          retention-days: 30
          if-no-files-found: warn
