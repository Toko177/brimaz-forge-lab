name: Commander simulator — run 4 AI games
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch containing the latest simulator code"
        type: string
        required: true
        default: feature/v22-four-ai-operator-smoke-and-counter-audit-20261010
      pod:
        description: "Which opponent pods to simulate"
        type: choice
        required: true
        options: [both, aristo, artifact]
        default: both
      policy:
        description: "Shared four-AI combat policy"
        type: choice
        required: true
        options: [v17_strict, v17_proactive, v19_removal, v20_shadow, critical_counter, v16, v15]
        default: v17_strict
      games_per_rotation:
        description: "Independent games per seat rotation (1–5)"
        required: true
        type: choice
        options: ["1", "2", "3", "5"]
        default: "2"
      seed_base:
        description: "Base Forge random seed"
        required: true
        type: string
        default: "20261012"
concurrency:
  group: manual-four-seat-commander-${{ github.run_id }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - id: config
        env:
          POD: ${{ inputs.pod }}
          GAMES: ${{ inputs.games_per_rotation }}
          SEED: ${{ inputs.seed_base }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os,sys
          games=int(os.environ["GAMES"])
          seed=int(os.environ["SEED"])
          assert 1<=games<=5
          assert 1<=seed<=2_000_000_000
          pods=["aristo","artifact"] if os.environ["POD"]=="both" else [os.environ["POD"]]
          assert set(pods)<={"aristo","artifact"}
          include=[{"pod":pod,"rotation":i} for pod in pods for i in range(4)]
          print("matrix="+json.dumps({"include":include},separators=(",",":")))
          print(f"COMMANDER_SIM_PLAN: {len(include)} independent Forge jobs, {len(include)*games} real matches",file=sys.stderr,flush=True)
          PY

  simulate:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: "${{ matrix.pod }} · seat rotation ${{ matrix.rotation }}"
    runs-on: ubuntu-latest
    timeout-minutes: 49
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Load the seven previously verified real Commander decks
        uses: actions/download-artifact@v4
        with:
          name: forge-seven-decks-canonical-verified
          run-id: 37966009166
          github-token: ${{ github.token }}
          path: canonical/
      - name: Verify all seven canonical DCK SHA256 hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forge_decks
          cp canonical/forge_normalized/*.dck forge_decks/
          python3 - <<'PY'
          import hashlib,json,pathlib
          report=json.loads(pathlib.Path('canonical/results/forge_normalization/report.json').read_text())
          assert not report['errors'] and len(report['decks'])==7
          for entry in report['decks']:
              file=pathlib.Path('forge_decks')/(entry['deck']+'.dck')
              assert hashlib.sha256(file.read_bytes()).hexdigest()==entry['normalized_sha256']
          print('MANUAL_FORGE_SEVEN_CANONICAL_DECKS_SHA256_VERIFIED')
          PY
      - uses: actions/cache/restore@v4
        with:
          path: forge-dist/
          key: forge-2.0.15-linux-shared-20261009
      - name: Retrieve pinned Forge 2.0.15 if not cached
        shell: bash
        run: |
          set -euo pipefail
          if ! find forge-dist -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 \
              'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Compile and apply documented Java 21 AI patches
        env:
          POLICY: ${{ inputs.policy }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit)"
          test -n "$JAR"
          echo "$JAR" >/tmp/commander_simulator_jar
          python3 scripts/patch_forge_charm_context.py --jar "$JAR"
          python3 scripts/patch_forge_brimaz_v13.py --jar "$JAR"
          python3 scripts/patch_forge_four_ai_targets.py --jar "$JAR"
          if [ "$POLICY" = "v19_removal" ] || [ "$POLICY" = "v20_shadow" ]; then
            test -f scripts/patch_forge_multiplayer_removal.py ||
              { echo "V19 policy requested but V19 patch absent from branch" >&2; exit 2; }
            python3 scripts/patch_forge_multiplayer_removal.py --jar "$JAR"
          fi
          if [ "$POLICY" = "critical_counter" ]; then
            test -f scripts/patch_forge_counter_critical.py ||
              { echo "Critical counter source patch absent from selected branch" >&2; exit 2; }
            python3 scripts/patch_forge_counter_critical.py --jar "$JAR"
          fi
      - name: Run genuine Commander games (all four positions distributed)
        env:
          POLICY: ${{ inputs.policy }}
          GAMES: ${{ inputs.games_per_rotation }}
          SEED: ${{ inputs.seed_base }}
          POD: ${{ matrix.pod }}
          ROTATION: ${{ matrix.rotation }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="-Dbrimaz.fourSeatCombatTarget=true -Dbrimaz.deterministicForcedAttacks=true"
          case "$POLICY" in
            v15) JAVA_TOOL_OPTIONS="$BASE -Dbrimaz.fourSeatDefensiveReserve=false -Dbrimaz.fourSeatDefenseCoverage=false";;
            v16) JAVA_TOOL_OPTIONS="$BASE -Dbrimaz.fourSeatDefensiveReserve=true -Dbrimaz.fourSeatDefenseCoverage=false";;
            v17_strict) JAVA_TOOL_OPTIONS="$BASE -Dbrimaz.fourSeatDefensiveReserve=false -Dbrimaz.fourSeatDefenseCoverage=true -Dbrimaz.coverageProactive=false";;
            v17_proactive) JAVA_TOOL_OPTIONS="$BASE -Dbrimaz.fourSeatDefensiveReserve=false -Dbrimaz.fourSeatDefenseCoverage=true -Dbrimaz.coverageProactive=true";;
            v19_removal) JAVA_TOOL_OPTIONS="$BASE -Dbrimaz.fourSeatDefensiveReserve=false -Dbrimaz.fourSeatDefenseCoverage=true -Dbrimaz.coverageProactive=false -Dbrimaz.fourSeatRemovalUrgency=true -Dbrimaz.removalUrgencyTrace=true";;
            v20_shadow) JAVA_TOOL_OPTIONS="$BASE -Dbrimaz.fourSeatDefensiveReserve=false -Dbrimaz.fourSeatDefenseCoverage=true -Dbrimaz.coverageProactive=false -Dbrimaz.fourSeatRemovalUrgency=false -Dbrimaz.removalShadowAudit=true";;
            critical_counter) JAVA_TOOL_OPTIONS="$BASE -Dbrimaz.fourSeatDefensiveReserve=false -Dbrimaz.fourSeatDefenseCoverage=true -Dbrimaz.fourSeatCounterCritical=true -Dbrimaz.counterDecisionAudit=true";;
            *) echo "Unknown AI policy" >&2; exit 2;;
          esac
          export JAVA_TOOL_OPTIONS
          python3 scripts/batch.py --jar "$(cat /tmp/commander_simulator_jar)" \
            --require-canonical-decks --pod "$POD" --rotation "$ROTATION" \
            --games-per-rotation "$GAMES" --seed-base "$SEED" \
            --clock 360 --timeout 445 \
            --out-tag "operator-run-$RUN_ID-rot$ROTATION" --policy-label "$POLICY"
      - name: Analyze every genuine Forge game, all four AI seats
        if: always()
        shell: bash
        run: |
          if find results/batch -name games.json -print -quit | grep -q .; then
            python3 scripts/forensic_four_seat.py --input results/batch \
              --output results/operator_forensics
          fi
      - name: Record exact executable, branch and policy provenance
        if: always()
        env:
          POLICY: ${{ inputs.policy }}
          SOURCE_REF: ${{ inputs.source_ref }}
          POD: ${{ matrix.pod }}
          ROTATION: ${{ matrix.rotation }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          path=pathlib.Path("results/operator_forensics")
          path.mkdir(parents=True,exist_ok=True)
          jar=pathlib.Path("/tmp/commander_simulator_jar")
          jar_path=pathlib.Path(jar.read_text().strip()) if jar.exists() else None
          report={
            "source_ref":os.environ["SOURCE_REF"],
            "head_sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "policy":os.environ["POLICY"],
            "pod":os.environ["POD"],"seat_rotation":int(os.environ["ROTATION"]),
            "forge_jar_sha256":hashlib.sha256(jar_path.read_bytes()).hexdigest()
                if jar_path and jar_path.exists() else None,
            "model":"Real Forge 2.0.15 / Commander / 4 independent AI seats",
            "evidence_standard":"Raw logs and hashes; independent Scryfall/Forge natural outcome certification still required before a winrate claim",
          }
          (path/"provenance.json").write_text(json.dumps(report,indent=2)+"\n")
          PY
      - name: Preserve complete raw game logs, decisions and status reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "commander-4ai-${{ github.run_id }}-${{ matrix.pod }}-rotation${{ matrix.rotation }}"
          path: |
            results/batch/
            results/operator_forensics/
          retention-days: 30
          if-no-files-found: ignore

  tournament-summary:
    name: Aggregate the genuine 4-AI match outcomes and censoring
    needs: [plan, simulate]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate uncertainty and completeness estimator
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_aggregate_four_ai_tournament.py
      - name: Restore all real per-rotation raw game manifests
        uses: actions/download-artifact@v4
        with:
          pattern: commander-4ai-${{ github.run_id }}-*
          path: merged_evidence/
          merge-multiple: false
      - name: Produce reproducible cross-job four-seat standings
        env:
          POD: ${{ inputs.pod }}
          GAMES: ${{ inputs.games_per_rotation }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$POD" = both ]; then JOBS=8; else JOBS=4; fi
          EXPECTED=$((JOBS * GAMES))
          python3 scripts/aggregate_four_ai_tournament.py \
            --input merged_evidence/ \
            --expected-jobs "$JOBS" --expected-games "$EXPECTED" \
            --out results/four_ai_tournament/
      - name: Publish all statuses, deck outcomes and statistical caveats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commander-4ai-${{ github.run_id }}-tournament-summary
          path: results/four_ai_tournament/
          retention-days: 30
          if-no-files-found: ignore
