name: Brimaz V5 audited pilot outcomes
on:
  push:
    paths: [.github/workflows/brimaz-v5-postmortem.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: brimaz-v5-*
          run-id: 37969072177
          github-token: ${{ github.token }}
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: legality-audit-all-playgroup-pods
          run-id: 37965067128
          github-token: ${{ github.token }}
          path: legality/
      - name: Independently certify canonical four-player AI games
        run: python3 scripts/certify_commander_games.py --input artifacts --legality legality/report.json --out results/v5/
      - name: Audit actual commander priority, Incubator transforms and wins
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,json,collections
          games=[]
          for x in pathlib.Path('artifacts').rglob('games.json'):
              games.extend(json.loads(x.read_text()))
          summary={
             'scheduled':len(games),
             'natural':sum(x['status']=='complete' for x in games),
             'brimaz_wins':sum(x.get('brimaz_win') is True and x['status']=='complete' for x in games),
             'commander_priority_proposals':sum(x.get('commander_priority_actions',0) for x in games),
             'incubator_priority_proposals':sum(x.get('incubator_priority_actions',0) for x in games),
             'sacrifice_planner_proposals':sum(x.get('planner_decisions',0) for x in games),
             'brimaz_spell_casts':sum(x.get('brimaz_casts',0) for x in games),
             'incubator_activations':sum(x.get('incubator_transforms',0) for x in games),
             'status_counts':dict(collections.Counter(x['status'] for x in games)),
          }
          assert len(games)==8,summary
          print('V5_AUDIT',json.dumps(summary,indent=2),flush=True)
          for x in games:
              print('V5_GAME',json.dumps({k:x.get(k) for k in
                    ['pod','rotation','seed','status','winner_deck','brimaz_win',
                     'brimaz_casts','planner_decisions','commander_priority_actions',
                     'incubator_priority_actions']},ensure_ascii=False),flush=True)
          pathlib.Path('results/v5/summary.json').write_text(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brimaz-v5-certified-postmortem
          path: results/v5/
          if-no-files-found: ignore
