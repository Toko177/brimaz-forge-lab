name: Brimaz V6 engine access verification
on:
  push:
    paths: [.github/workflows/brimaz-v6-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: brimaz-v6-*
          run-id: 37969934893
          github-token: ${{ github.token }}
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: legality-audit-all-playgroup-pods
          run-id: 37965067128
          github-token: ${{ github.token }}
          path: legality/
      - name: Verify four games and Scryfall legal decks
        run: python3 scripts/certify_commander_games.py --input artifacts --legality legality/report.json --out results/v6/
      - name: Measure actual use of formerly excluded cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,collections,re
          games=[]
          for f in pathlib.Path('artifacts').rglob('games.json'):
              games.extend(json.loads(f.read_text()))
          assert len(games)==4,len(games)
          summ=collections.Counter()
          cards=['Orzhov Signet','Spawning Pit','Krark-Clan Ironworks']
          for g in games:
              log=list(pathlib.Path('artifacts').rglob(pathlib.Path(g['log']).name))
              # Identical game filenames may occur across pods. Use local manifest's relative directory.
              root=[x for x in pathlib.Path('artifacts').rglob('games.json') if
                    g in json.loads(x.read_text())]
              assert len(root)==1,root
              f=root[0].parent/pathlib.Path(g['log']).name
              raw=f.read_text()
              assert g['status']=='complete',g
              summ['games']+=1
              summ['brimaz_wins']+=int(g.get('brimaz_win') is True)
              summ['priority_commander_casts']+=g.get('commander_priority_actions',0)
              summ['priority_engine_casts']+=raw.count('BRIMAZ_DEVELOPMENT: cast-engine')
              for name in cards:
                  pattern=r'^Add To Stack: .+ cast '+re.escape(name)+r'\b'
                  n=len(re.findall(pattern,raw,re.M))
                  summ['cast_'+name]+=n
              print('V6_GAME',g['pod'],g['seed'],g['winner_deck'],
                    'priority_development',g.get('development_actions',0),flush=True)
          print('V6_SUMMARY',json.dumps(dict(summ),ensure_ascii=False),flush=True)
          pathlib.Path('results/v6/engine-use.json').write_text(json.dumps(dict(summ),indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brimaz-v6-independent-quality-report
          path: results/v6/
          if-no-files-found: ignore
