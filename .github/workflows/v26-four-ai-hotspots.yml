name: V26 real four-AI Forge CPU hotspot profiler
on:
  pull_request:
    branches: [feature/v25-all-seats-real-evidence-20261011]
    paths:
      - .github/workflows/v26-four-ai-hotspots.yml
      - scripts/batch.py
      - scripts/analyze_four_ai_timeout_stacks.py
  workflow_dispatch:
concurrency:
  group: v26-one-real-forge-jfr-profile
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  sample-real-game:
    name: One genuine four-AI Commander game with 128 MB JFR CPU samples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve seven original SHA256 verified playgroup decks
        uses: actions/download-artifact@v4
        with:
          name: forge-seven-decks-canonical-verified
          run-id: 37966009166
          github-token: ${{ github.token }}
          path: canonical/
      - name: Check every original deck SHA256 and prepare real Forge source
        run: |
          set -euo pipefail
          mkdir -p forge_decks
          cp canonical/forge_normalized/*.dck forge_decks/
          python3 - <<'PY'
          import hashlib,json,pathlib
          r=json.loads(pathlib.Path('canonical/results/forge_normalization/report.json').read_text())
          assert not r['errors'] and len(r['decks'])==7
          for item in r['decks']:
            f=pathlib.Path('forge_decks')/(item['deck']+'.dck')
            assert hashlib.sha256(f.read_bytes()).hexdigest()==item['normalized_sha256']
          print("FOUR_AI_REAL_JFR_ALL_SEVEN_DECKS_SHA256_OK")
          PY
      - uses: actions/cache/restore@v4
        with:
          path: forge-dist/
          key: forge-2.0.15-linux-shared-20261009
      - name: Install pinned original Forge 2.0.15 if uncached
        run: |
          set -euo pipefail
          if ! find forge-dist -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist
            tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: Reproduce actual four-seat Forge Java21 runtime, policies held constant
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit)"
          test -s "$JAR"
          echo "$JAR" > /tmp/jfr-forge-jar
          python3 scripts/patch_forge_charm_context.py --jar "$JAR"
          python3 scripts/patch_forge_brimaz_v13.py --jar "$JAR"
          python3 scripts/patch_forge_four_ai_targets.py --jar "$JAR"
          python3 scripts/patch_forge_combat_trigger_prune.py --jar "$JAR"
      - name: Profile REAL four AI Commander including complex slow combat (not a speed benchmark)
        env:
          JAVA_TOOL_OPTIONS: "-Dbrimaz.fourSeatCombatTarget=true -Dbrimaz.deterministicForcedAttacks=true -Dbrimaz.fourSeatDefenseCoverage=true -Dbrimaz.coverageProactive=false -Dbrimaz.aiTimeoutCooldown=false -Dbrimaz.fastCombatTriggerNegativePrune=true -Dbrimaz.fastCombatTriggerTrace=true"
        run: |
          set -euo pipefail
          python3 scripts/batch.py --jar "$(cat /tmp/jfr-forge-jar)" \
            --require-canonical-decks --jfr --pod aristo --rotation 1 \
            --out-tag V26-real-combat-jfr --policy-label V24-fast-negative-with-JFR \
            --seed-base 20261023 --games-per-rotation 1 --clock 420 --timeout 505
      - name: Record actual JFR hot methods and per-thread CPU activity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/v26_jfr_evidence
          find results/batch/ -name '*.jfr' -type f -print > results/v26_jfr_evidence/recordings.txt
          test -s results/v26_jfr_evidence/recordings.txt || { echo 'No genuine JFR recording created' >&2; exit 2; }
          while IFS= read -r recording; do
            set +e
            jfr summary "$recording" > results/v26_jfr_evidence/events.txt 2>&1
            jfr view --width 170 hot-methods "$recording" > results/v26_jfr_evidence/hot_methods.txt 2>&1
            jfr view --width 170 thread-cpu-load "$recording" > results/v26_jfr_evidence/cpu_threads.txt 2>&1
            set -e
          done < results/v26_jfr_evidence/recordings.txt
          python3 scripts/analyze_four_ai_timeout_stacks.py --input results/batch/ --out results/v26_jfr_evidence/
          python3 - <<'PY'
          from pathlib import Path
          d=Path('results/v26_jfr_evidence')
          assert any(x.stat().st_size for x in Path('results/batch').rglob('*.jfr')), "Empty CPU samples"
          print("FOUR_AI_REAL_FORGE_JFR_SAMPLE_RECORDED")
          for name in ('hot_methods.txt','cpu_threads.txt','ai_timeout_stacks.json'):
            p=d/name
            print(name,'bytes=',p.stat().st_size if p.is_file() else 'MISSING')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-ai-v26-genuine-forge-jfr-hot-methods
          path: |
            results/v26_jfr_evidence/
            results/batch/
          retention-days: 30
          if-no-files-found: ignore
