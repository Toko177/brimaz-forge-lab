name: Brimaz state-aware AI patch validation
on:
  push:
    paths:
      - ".github/workflows/brimaz-policy-test.yml"
      - "scripts/patch_forge_brimaz.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: kaal-playgroup-deck-snapshots
          run-id: 37952122924
          github-token: ${{ github.token }}
          path: .
      - name: Download and verify original Forge 2.0.15
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2
          echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
          mkdir -p forge-dist
          tar -xjf forge.tar.bz2 -C forge-dist
      - name: Compile patch against version-pinned Forge JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          test -n "$JAR"
          cp "$JAR" "$JAR.original"
          python3 scripts/patch_forge_brimaz.py --jar "$JAR"
          unzip -l "$JAR" | grep BrimazTurnPlanner
      - name: Run four-seat mixed Commander with improved Brimaz AI
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          python3 scripts/smoke.py --jar "$JAR" --games 1 --clock 360 --timeout 445 --opponents Kaal_9594008 Kaal_10347090 Kaal_21930525 || true
          test -f results/smoke.json
          cat results/smoke.json
          grep -c "BRIMAZ_PLANNER:" results/forge-smoke.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brimaz-policy-patch-validation
          path: results/
          if-no-files-found: ignore
