name: Playgroup EDH Forge pilot
on:
  push:
    paths:
      - ".github/workflows/playgroup-pilot.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  playgroup-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore vetted KaalDeagle lists
        uses: actions/download-artifact@v4
        with:
          name: kaal-playgroup-deck-snapshots
          run-id: 37952122924
          github-token: ${{ github.token }}
          path: .
      - name: Validate selected opponent deck files
        shell: bash
        run: |
          set -euo pipefail
          test -f forge_decks/Kaal_9594008.dck
          test -f forge_decks/Kaal_10347090.dck
          test -f forge_decks/Kaal_21930525.dck
          cat results/playgroup/import-report.json
      - name: Download and verify Forge 2.0.15
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 25 --max-time 480 -o forge.tar.bz2 'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
          echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
          mkdir -p forge-dist
          tar -xjf forge.tar.bz2 -C forge-dist
      - name: Four IA Brimaz vs Radha Tazri Zimone and Dina
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          test -n "$JAR"
          python3 scripts/smoke.py --jar "$JAR" --games 1 --clock 360 --timeout 450 --opponents Kaal_9594008 Kaal_10347090 Kaal_21930525
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaal-playgroup-pilot-logs
          path: |
            results/smoke.json
            results/forge-smoke.log
            results/playgroup/import-report.json
          if-no-files-found: ignore
