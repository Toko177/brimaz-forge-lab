name: Audit unsupported Forge AI cards in playgroup decks
on:
  push:
    paths: [.github/workflows/forge-ai-card-audit.yml, tests/java/forge/integration/AuditCardAIHints.java]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: forge-seven-decks-canonical-verified
          run-id: 37966009166
          github-token: ${{ github.token }}
          path: canonical/
      - uses: actions/cache/restore@v4
        with:
          path: forge-dist/
          key: forge-2.0.15-linux-shared-20261009
      - name: Obtain exact Forge 2.0.15
        shell: bash
        run: |
          set -euo pipefail
          if ! find forge-dist -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit | grep -q .; then
            curl -fL --retry 3 --max-time 480 -o forge.tar.bz2 'https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2'
            echo '4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge.tar.bz2' | sha256sum -c -
            mkdir -p forge-dist && tar -xjf forge.tar.bz2 -C forge-dist
          fi
      - name: List AI-blacklisted spells without simulating games
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$PWD/forge-dist" -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
          mkdir -p /tmp/audit-classes
          javac --release 21 -cp "$JAR" -d /tmp/audit-classes tests/java/forge/integration/AuditCardAIHints.java
          (cd "$(dirname "$JAR")" && java -Xmx3g -cp "$JAR:/tmp/audit-classes" forge.integration.AuditCardAIHints "$GITHUB_WORKSPACE"/canonical/forge_normalized/*.dck)
